<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>۱۶۳۲ سوال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05060f;
    --nebula:#3a2a6b;
    --nebula2:#1c3a5e;
    --star:#f3e3b8;
    --star-bright:#fff7e0;
    --ink:#eae6f5;
    --muted:#8a86a8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--void);
    color:var(--ink);
    font-family:"Lalezar","Vazirmatn","Tahoma",sans-serif;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas#field{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
  }
  .nebula{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse 55% 40% at 18% 22%, rgba(58,42,107,.55), transparent 60%),
      radial-gradient(ellipse 45% 35% at 82% 75%, rgba(28,58,94,.5), transparent 60%),
      radial-gradient(ellipse 60% 45% at 75% 15%, rgba(80,40,90,.3), transparent 65%);
    filter:blur(2px);
    transition:opacity .5s ease;
  }
  main{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: max(28px, env(safe-area-inset-top,0px)) 24px max(28px, env(safe-area-inset-bottom,0px));
    text-align:center;
  }
  .orb-wrap{
    position:relative;
    width:min(640px, 88vw);
    min-height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #sentence{
    font-size:clamp(1.15rem, 2.3vw + .6rem, 1.7rem);
    line-height:2.05;
    font-weight:400;
    max-width:38ch;
    margin:0 auto;
    opacity:0;
    filter:blur(6px);
    transform:scale(.96);
    transition:opacity .6s ease, filter .6s ease, transform .6s ease;
    text-shadow:0 0 24px rgba(243,227,184,.15);
  }
  #sentence.show{opacity:1; filter:blur(0); transform:scale(1);}

  .egg{
    position:fixed;
    inset:0;
    z-index:10;
    background:
      radial-gradient(circle at 18% 25%, rgba(255,235,230,.22), transparent 16%),
      radial-gradient(circle at 68% 60%, rgba(255,235,230,.16), transparent 20%),
      radial-gradient(circle at 40% 85%, rgba(255,235,230,.12), transparent 14%),
      radial-gradient(circle at 80% 15%, rgba(40,0,6,.5), transparent 28%),
      radial-gradient(circle at 25% 75%, rgba(40,0,6,.45), transparent 32%),
      repeating-linear-gradient(118deg, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 2px, transparent 2px, transparent 7px),
      linear-gradient(160deg, #9c1b26, #6e0f18 55%, #420911);
    color:#fce9e6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(1.1rem, 4vw, 2rem);
    letter-spacing:1px;
    text-shadow:0 0 14px rgba(0,0,0,.6), 0 2px 0 #2b0509;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .egg.show{opacity:1;}

  .err{color:#e0a37a; font-size:1rem;}

  /* ---------- unlock star + chat ---------- */
  .unlock-star{
    position:fixed;
    bottom:22px;
    left:22px;
    z-index:6;
    width:34px;
    height:34px;
    border:none;
    background:transparent;
    color:var(--star-bright);
    font-size:1.3rem;
    opacity:0;
    pointer-events:none;
    transform:scale(.5);
    transition:opacity .6s ease, transform .6s ease;
    text-shadow:0 0 10px rgba(243,227,184,.8), 0 0 22px rgba(243,227,184,.4);
    animation:pulseStar 2.4s ease-in-out infinite;
  }
  .unlock-star.show{opacity:1; pointer-events:auto; transform:scale(1);}
  @keyframes pulseStar{
    0%,100%{text-shadow:0 0 10px rgba(243,227,184,.8), 0 0 22px rgba(243,227,184,.4);}
    50%{text-shadow:0 0 16px rgba(243,227,184,1), 0 0 34px rgba(243,227,184,.7);}
  }

  .chat-overlay{
    position:fixed;
    inset:0;
    z-index:8;
    background:linear-gradient(180deg, #0b0e24ee, #05060fee);
    display:flex;
    flex-direction:column;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
  }
  .chat-overlay.show{opacity:1; pointer-events:auto;}
  .chat-close{
    align-self:flex-start;
    margin:max(16px, env(safe-area-inset-top,0px)) 16px 0;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid rgba(243,227,184,.3);
    background:rgba(255,255,255,.04);
    color:var(--star);
    font-size:1rem;
    cursor:pointer;
  }
  .chat-messages{
    flex:1;
    overflow-y:auto;
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .bubble{
    max-width:78%;
    padding:10px 14px;
    border-radius:16px;
    font-size:.95rem;
    line-height:1.8;
    text-align:right;
    opacity:0;
    transform:translateY(6px);
    animation:bubbleIn .35s ease forwards;
  }
  @keyframes bubbleIn{ to{opacity:1; transform:translateY(0);} }
  .bubble.out{
    margin-left:auto;
    background:linear-gradient(135deg, rgba(243,227,184,.92), rgba(224,163,122,.92));
    color:#2a1a10;
    border-bottom-left-radius:4px;
  }
  .bubble.in{
    margin-right:auto;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
    color:var(--ink);
    border-bottom-right-radius:4px;
  }
  .chat-options{
    max-height:38vh;
    overflow-y:auto;
    padding:10px 16px max(14px, env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    gap:8px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .chat-option-btn{
    text-align:right;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(243,227,184,.25);
    color:var(--ink);
    border-radius:12px;
    padding:10px 14px;
    font-size:.9rem;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .chat-option-btn:hover{background:rgba(243,227,184,.1); border-color:rgba(243,227,184,.55);}

  @media (prefers-reduced-motion: reduce){
    #sentence{transition:opacity .3s ease;}
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="nebula" id="nebula"></div>
<main>
  <div class="orb-wrap">
    <p id="sentence"></p>
  </div>
</main>
<div class="egg" id="egg">t.me/decaydmeats</div>

<button class="unlock-star" id="unlockStar" aria-label="ستاره">✦</button>
<div class="chat-overlay" id="chatOverlay">
  <button class="chat-close" id="chatClose">✕</button>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-options" id="chatOptions"></div>
</div>

<script>
/* ---------- starfield / warp canvas ---------- */
const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, fx, fy, stars = [];

const STAR_COUNT_DIVISOR = 4500;

function makeStar(nearCenter){
  const ang = Math.random()*Math.PI*2;
  const dist = (nearCenter ? Math.random()*40 : 40 + Math.random()*Math.max(W,H)*0.7);
  return {
    ang, dist,
    z: 0.35 + Math.random()*0.65,
    baseA: Math.random()*0.6 + 0.25,
    phase: Math.random()*Math.PI*2,
    twSpeed: Math.random()*0.006 + 0.002,
    r: Math.random()*1.2 + 0.3
  };
}

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W/2; cy = H/2;
  fx = cx; fy = cy;
  const count = Math.floor((W*H)/STAR_COUNT_DIVISOR);
  stars = Array.from({length: count}, () => makeStar(false));
}
window.addEventListener('resize', resize);
resize();

let warping = false;
let warpStart = 0;
let lastWarpElapsed = 0;
const WARP_DURATION = 1100;
const WARP_K = 4.2;
const WARP_Z_FLOOR = 0.02;

function project(s, zOverride){
  const z = zOverride !== undefined ? zOverride : s.z;
  const scale = 1/z;
  return { x: fx + Math.cos(s.ang)*s.dist*scale, y: fy + Math.sin(s.ang)*s.dist*scale, scale };
}

function warpZAt(elapsedMs, z0){
  const sec = elapsedMs/1000;
  return Math.max(WARP_Z_FLOOR, z0*Math.exp(-WARP_K*sec*sec));
}

function drawFrame(t){
  ctx.fillStyle = 'rgba(5,6,15,1)';
  ctx.clearRect(0,0,W,H);

  if(warping){
    const elapsed = t - warpStart;

    for(const s of stars){
      const beforeZ = warpZAt(lastWarpElapsed, s.warpZ0);
      const afterZ = warpZAt(elapsed, s.warpZ0);
      const before = project(s, beforeZ);
      const after = project(s, afterZ);
      const a = Math.min(0.85, 0.1 + after.scale*0.1);
      ctx.strokeStyle = `rgba(243,227,184,${a})`;
      ctx.lineWidth = Math.min(2.4, 0.3 + after.scale*0.3);
      ctx.beginPath();
      ctx.moveTo(before.x, before.y);
      ctx.lineTo(after.x, after.y);
      ctx.stroke();
    }
    lastWarpElapsed = elapsed;

    if(elapsed >= WARP_DURATION){
      warping = false;
      for(const s of stars){ s.z = 0.35 + Math.random()*0.65; s.dist = 40 + Math.random()*Math.max(W,H)*0.7; s.ang = Math.random()*Math.PI*2; }
      nebulaEl.style.opacity = '1';
    }
  } else {
    for(const s of stars){
      const tw = Math.sin(t*s.twSpeed + s.phase)*0.35;
      const a = Math.max(0, Math.min(1, s.baseA + tw));
      const pos = project(s);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(243,227,184,${a})`;
      ctx.fill();
    }
  }
  requestAnimationFrame(drawFrame);
}
requestAnimationFrame(drawFrame);

/* ---------- sentence data ---------- */
let sentences = [];
const sentenceEl = document.getElementById('sentence');
const nebulaEl = document.getElementById('nebula');
const orbWrap = document.querySelector('.orb-wrap');
let pendingIndex = null;
let ready = false;

async function loadSentences(){
  try{
    const res = await fetch('1632.json?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('bad status');
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('empty');
    sentences = data;
    ready = true;
    startWarp();
  }catch(e){
    sentenceEl.innerHTML = '<span class="err">فایل ۱۶۳۲.json پیدا نشد یا نامعتبر است.<br>باید کنار index.html و به‌صورت آرایه‌ای از رشته‌ها باشد.</span>';
    sentenceEl.classList.add('show');
  }
}

function startWarp(){
  if(!ready || warping) return;
  clearTimeout(autoTimer);
  pendingIndex = Math.floor(Math.random()*sentences.length);
  for(const s of stars){ s.warpZ0 = s.z; }
  lastWarpElapsed = 0;
  warping = true;
  warpStart = performance.now();
  nebulaEl.style.opacity = '0.35';
  revealSentence();
}

let revealCount = 0;

function revealSentence(){
  revealCount++;
  if(revealCount >= 10){ unlockStarEl.classList.add('show'); }

  const rect = orbWrap.getBoundingClientRect();
  const originX = rect.left + rect.width/2;
  const originY = rect.top + rect.height/2;
  const rawDx = fx - originX, rawDy = fy - originY;
  const dist = Math.hypot(rawDx, rawDy) || 1;
  const cap = Math.min(W, H) * 0.38;
  const mag = Math.min(dist, cap);
  const dx = (rawDx/dist) * mag;
  const dy = (rawDy/dist) * mag;

  sentenceEl.style.transition = 'opacity .15s ease, filter .15s ease, transform .15s ease';
  sentenceEl.style.opacity = '0';
  sentenceEl.style.filter = 'blur(6px)';
  sentenceEl.style.transform = 'scale(.9)';

  setTimeout(() => {
    sentenceEl.textContent = sentences[pendingIndex];
    sentenceEl.style.transition = 'none';
    sentenceEl.style.transform = `translate(${dx}px, ${dy}px) scale(0.12)`;
    sentenceEl.style.opacity = '0';
    sentenceEl.style.filter = 'blur(10px)';
    void sentenceEl.offsetWidth; // force reflow so the transition below actually animates
    sentenceEl.style.transition = 'opacity .8s ease-out, filter .8s ease-out, transform .9s cubic-bezier(.16,1,.3,1)';
    sentenceEl.style.transform = 'translate(0px, 0px) scale(1)';
    sentenceEl.style.opacity = '1';
    sentenceEl.style.filter = 'blur(0px)';
  }, 150);

  scheduleAuto();
}

document.body.addEventListener('click', (e) => {
  const now = Date.now();
  clickTimes.push(now);
  clickTimes = clickTimes.filter(ts => now - ts < RAPID_WINDOW);
  if(clickTimes.length >= RAPID_THRESHOLD){
    clickTimes = [];
    showEasterEgg();
    return;
  }
  fx = e.clientX;
  fy = e.clientY;
  startWarp();
});

const RAPID_WINDOW = 1500;
const RAPID_THRESHOLD = 8;
let clickTimes = [];
const eggEl = document.getElementById('egg');
let eggTimer = null;

function showEasterEgg(){
  clearTimeout(autoTimer);
  clearTimeout(eggTimer);
  eggEl.classList.add('show');
  eggTimer = setTimeout(() => {
    eggEl.classList.remove('show');
    scheduleAuto();
  }, 3200);
}

const AUTO_INTERVAL = 16320; // 16.32 ثانیه
let autoTimer = null;
function scheduleAuto(){
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => {
    fx = cx;
    fy = cy;
    startWarp();
  }, AUTO_INTERVAL);
}

loadSentences();

/* ---------- unlock star + messenger-style chat ---------- */
const unlockStarEl = document.getElementById('unlockStar');
const chatOverlay = document.getElementById('chatOverlay');
const chatMessages = document.getElementById('chatMessages');
const chatOptions = document.getElementById('chatOptions');
const chatClose = document.getElementById('chatClose');

let starItems = null;
let starLoading = false;

async function loadStarMessages(){
  if(starItems || starLoading) return;
  starLoading = true;
  try{
    const res = await fetch('1632Star.json?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('bad status');
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('empty');
    starItems = data;
    renderChatOptions();
  }catch(e){
    chatOptions.innerHTML = '<span class="err">فایل ۱۶۳۲Star.json پیدا نشد یا نامعتبر است.<br>باید آرایه‌ای از آیتم‌های {send, reply} باشد.</span>';
  }
  starLoading = false;
}

function renderChatOptions(){
  if(!starItems) return;
  chatOptions.innerHTML = '';
  starItems.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'chat-option-btn';
    btn.textContent = item.send;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      sendChatMessage(item);
    });
    chatOptions.appendChild(btn);
  });
}

function addBubble(text, kind){
  const b = document.createElement('div');
  b.className = 'bubble ' + kind;
  b.textContent = text;
  chatMessages.appendChild(b);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function sendChatMessage(item){
  addBubble(item.send, 'out');
  setTimeout(() => {
    addBubble(item.reply, 'in');
  }, 750);
}

function openChat(){
  clearTimeout(autoTimer);
  chatOverlay.classList.add('show');
  loadStarMessages();
}

function closeChat(){
  chatOverlay.classList.remove('show');
  scheduleAuto();
}

unlockStarEl.addEventListener('click', (e) => {
  e.stopPropagation();
  openChat();
});
chatClose.addEventListener('click', (e) => {
  e.stopPropagation();
  closeChat();
});
chatOverlay.addEventListener('click', (e) => e.stopPropagation());
</script>
</body>
</html>

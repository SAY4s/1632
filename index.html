<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>۱۶۳۲ سوال</title>
<style>
  :root{
    --bg:#faf7f2;
    --card:#ffffff;
    --ink:#1f1b16;
    --accent:#b5533c;
    --muted:#8a8078;
    --border:#e7ded2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161310;
      --card:#211c17;
      --ink:#f1ece3;
      --accent:#e08a6d;
      --muted:#a89d90;
      --border:#3a332a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161310;
    --card:#211c17;
    --ink:#f1ece3;
    --accent:#e08a6d;
    --muted:#a89d90;
    --border:#3a332a;
  }
  *{box-sizing:border-box;}
  html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: "Vazirmatn","Vazir","IRANSans","Tahoma",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: max(24px, env(safe-area-inset-top,0px)) 20px max(24px, env(safe-area-inset-bottom,0px));
  }
  .wrap{
    width:100%;
    max-width:640px;
    text-align:center;
  }
  h1{
    font-size:1.1rem;
    color:var(--muted);
    font-weight:500;
    letter-spacing:.5px;
    margin:0 0 28px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:44px 32px;
    min-height:160px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
  }
  #sentence{
    font-size:1.5rem;
    line-height:2.1;
    margin:0;
  }
  .count{
    margin-top:14px;
    font-size:.85rem;
    color:var(--muted);
  }
  button{
    margin-top:28px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px 30px;
    border-radius:999px;
    font-size:1rem;
    font-family:inherit;
    cursor:pointer;
    transition:opacity .15s;
  }
  button:active{opacity:.75;}
  .err{color:var(--accent); font-size:1rem;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>۱۶۳۲ سوال</h1>
    <div class="card">
      <p id="sentence">در حال بارگذاری...</p>
    </div>
    <div class="count" id="count"></div>
    <button id="next">یک سوال دیگر</button>
  </div>

<script>
let sentences = [];

async function loadSentences(){
  try{
    const res = await fetch('1632.json');
    if(!res.ok) throw new Error('bad status');
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('empty');
    sentences = data;
    document.getElementById('count').textContent = sentences.length.toLocaleString('fa-IR') + ' سوال بارگذاری شد';
    showRandom();
  }catch(e){
    document.getElementById('sentence').innerHTML =
      '<span class="err">فایل 1632.json پیدا نشد یا نامعتبر است.<br>این فایل باید کنار index.html و به شکل آرایه‌ای از رشته‌ها باشد.</span>';
  }
}

function showRandom(){
  if(sentences.length === 0) return;
  const i = Math.floor(Math.random() * sentences.length);
  document.getElementById('sentence').textContent = sentences[i];
}

document.getElementById('next').addEventListener('click', showRandom);
loadSentences();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>۱۶۳۲ سوال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05060f;
    --nebula:#3a2a6b;
    --nebula2:#1c3a5e;
    --star:#f3e3b8;
    --star-bright:#fff7e0;
    --ink:#eae6f5;
    --muted:#8a86a8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--void);
    color:var(--ink);
    font-family:"Lalezar","Vazirmatn","Tahoma",sans-serif;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  button{font-family:inherit;}
  canvas#field{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
  }
  .nebula{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse 55% 40% at 18% 22%, rgba(58,42,107,.55), transparent 60%),
      radial-gradient(ellipse 45% 35% at 82% 75%, rgba(28,58,94,.5), transparent 60%),
      radial-gradient(ellipse 60% 45% at 75% 15%, rgba(80,40,90,.3), transparent 65%);
    filter:blur(2px);
    transition:opacity .5s ease;
  }

  /* ---------- constellation ---------- */
  .sky{
    position:fixed;
    inset:0;
    z-index:2;
    transition:opacity .5s ease;
  }
  .sky.hidden{opacity:0; pointer-events:none; transition-duration:.2s;}
  .sky.dim{opacity:.15; pointer-events:none;}
  .cstar{
    position:absolute;
    width:52px;
    height:52px;
    margin:-26px 0 0 -26px;
    padding:0;
    border:none;
    background:transparent;
    color:var(--star-bright);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:starIn .7s ease both;
  }
  .cstar .g{
    font-size:var(--s,18px);
    line-height:1;
    text-shadow:0 0 8px rgba(243,227,184,.8), 0 0 20px rgba(243,227,184,.35);
    animation:twinkle var(--d,3.2s) ease-in-out infinite;
    animation-delay:var(--dl,0s);
    transition:transform .25s ease;
  }
  .cstar:hover .g, .cstar:focus-visible .g{transform:scale(1.35);}
  .cstar:focus-visible{outline:none;}
  .cstar .n{
    position:absolute;
    top:100%;
    left:50%;
    transform:translate(-50%,-10px);
    font-size:.64rem;
    color:var(--star);
    opacity:.5;
    white-space:nowrap;
    pointer-events:none;
  }
  .cstar.seen .g{color:#cdb9ff; text-shadow:0 0 8px rgba(160,140,255,.7), 0 0 18px rgba(160,140,255,.3);}
  .cstar.seen .n{opacity:.3;}
  @keyframes twinkle{
    0%,100%{opacity:1;}
    50%{opacity:.45;}
  }
  @keyframes starIn{
    from{opacity:0; transform:scale(.3);}
    to{opacity:1; transform:scale(1);}
  }

  /* ---------- sentence reader ---------- */
  .reader{
    position:fixed;
    inset:0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(28px, env(safe-area-inset-top,0px)) 24px max(28px, env(safe-area-inset-bottom,0px));
    text-align:center;
    background:rgba(5,6,15,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .reader.show{opacity:1; pointer-events:auto;}
  .reader-box{
    width:min(640px, 88vw);
    opacity:0;
  }
  .reader-num{
    font-size:.95rem;
    color:var(--star);
    opacity:.75;
    margin-bottom:14px;
    letter-spacing:.04em;
  }
  .reader-text{
    margin:0 auto;
    font-size:clamp(1.15rem, 2.3vw + .6rem, 1.7rem);
    line-height:2.05;
    font-weight:400;
    max-width:38ch;
    text-shadow:0 0 24px rgba(243,227,184,.15);
  }

  .err{
    position:fixed;
    inset:0;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
    line-height:2;
    color:#e0a37a;
    font-size:1rem;
  }
  .err[hidden]{display:none;}

  /* ---------- unlock star + all-sentences list ---------- */
  .unlock-star{
    position:fixed;
    bottom:22px;
    left:22px;
    z-index:6;
    width:34px;
    height:34px;
    border:none;
    background:transparent;
    color:var(--star-bright);
    font-size:1.3rem;
    opacity:0;
    pointer-events:none;
    transform:scale(.5);
    transition:opacity .6s ease, transform .6s ease;
    text-shadow:0 0 10px rgba(243,227,184,.8), 0 0 22px rgba(243,227,184,.4);
    animation:pulseStar 2.4s ease-in-out infinite;
    cursor:pointer;
  }
  .unlock-star.show{opacity:1; pointer-events:auto; transform:scale(1);}
  @keyframes pulseStar{
    0%,100%{text-shadow:0 0 10px rgba(243,227,184,.8), 0 0 22px rgba(243,227,184,.4);}
    50%{text-shadow:0 0 16px rgba(243,227,184,1), 0 0 34px rgba(243,227,184,.7);}
  }

  .list-overlay{
    position:fixed;
    inset:0;
    z-index:8;
    display:flex;
    flex-direction:column;
    background:rgba(8,9,22,.96);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    cursor:default;
    user-select:text;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .list-overlay.show{opacity:1; pointer-events:auto;}
  .list-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:max(12px, env(safe-area-inset-top,0px)) 14px 12px;
    border-bottom:1px solid rgba(243,227,184,.12);
  }
  .list-back{
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--star);
    font-size:1.2rem;
    cursor:pointer;
  }
  .list-title{flex:1; color:var(--star-bright); font-size:1rem;}
  .list-count{color:var(--muted); font-size:.85rem;}

  .jump-bar{
    display:flex;
    gap:8px;
    padding:10px 14px 6px;
  }
  .jump-input{
    flex:1;
    min-width:0;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(243,227,184,.18);
    outline:none;
    color:var(--ink);
    border-radius:20px;
    padding:9px 16px;
    font-size:16px;
    font-family:inherit;
    text-align:right;
  }
  .jump-input:focus{border-color:rgba(243,227,184,.5);}
  .jump-input::placeholder{color:var(--muted);}
  .jump-btn{
    border:none;
    border-radius:20px;
    padding:0 18px;
    background:rgba(243,227,184,.16);
    color:var(--star-bright);
    font-size:.92rem;
    cursor:pointer;
  }
  .jump-btn:active{background:rgba(243,227,184,.3);}
  .jump-msg{
    margin:0;
    padding:2px 18px 6px;
    min-height:1.4em;
    font-size:.8rem;
    color:#e0a37a;
  }
  .jump-result{
    margin:0 14px 8px;
    padding:12px 16px;
    border-radius:14px;
    background:rgba(243,227,184,.08);
    border:1px solid rgba(243,227,184,.28);
    line-height:2;
  }
  .jump-result[hidden]{display:none;}
  .jump-result .num{display:block; font-size:.8rem; color:var(--star); opacity:.8;}
  .jump-result .txt{font-size:1.05rem; color:var(--star-bright);}

  .list-body{
    flex:1;
    overflow-y:auto;
    padding:4px 14px max(16px, env(safe-area-inset-bottom,0px));
    -webkit-overflow-scrolling:touch;
  }
  .row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:10px 6px;
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .row .num{
    flex:0 0 3.2em;
    text-align:center;
    color:var(--star);
    opacity:.7;
    font-size:.82rem;
    padding-top:3px;
  }
  .row .txt{flex:1; font-size:.98rem; line-height:1.9; color:var(--ink);}
  .row.hl{
    background:rgba(243,227,184,.1);
    border-radius:10px;
    animation:hlPulse 1.6s ease-out 1;
  }
  @keyframes hlPulse{
    0%{box-shadow:0 0 0 2px rgba(243,227,184,.7);}
    100%{box-shadow:0 0 0 2px rgba(243,227,184,0);}
  }

  @media (prefers-reduced-motion: reduce){
    .cstar, .cstar .g, .unlock-star{animation:none;}
    .row.hl{animation:none;}
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="nebula" id="nebula"></div>

<div class="sky hidden" id="sky" role="group" aria-label="صورت‌فلکی جمله‌ها"></div>

<div class="reader" id="reader">
  <div class="reader-box" id="readerBox">
    <div class="reader-num" id="readerNum"></div>
    <p class="reader-text" id="readerText"></p>
  </div>
</div>

<p class="err" id="err" hidden></p>

<button class="unlock-star" id="unlockStar" aria-label="همه‌ی جمله‌ها">✦</button>

<div class="list-overlay" id="listOverlay" role="dialog" aria-label="همه‌ی جمله‌ها">
  <div class="list-header">
    <button class="list-back" id="listClose" aria-label="بستن">→</button>
    <div class="list-title">همه‌ی جمله‌ها</div>
    <div class="list-count" id="listCount"></div>
  </div>
  <div class="jump-bar">
    <input type="text" class="jump-input" id="jumpInput" inputmode="numeric" placeholder="شماره‌ی جمله" autocomplete="off">
    <button class="jump-btn" id="jumpBtn">نشون بده</button>
  </div>
  <p class="jump-msg" id="jumpMsg"></p>
  <div class="jump-result" id="jumpResult" hidden>
    <span class="num" id="jumpResultNum"></span>
    <span class="txt" id="jumpResultTxt"></span>
  </div>
  <div class="list-body" id="listBody"></div>
</div>

<script>
/* ---------- helpers ---------- */
const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const fa = n => String(n).replace(/\d/g, d => FA_DIGITS[d]);
const en = s => String(s)
  .replace(/[۰-۹]/g, d => FA_DIGITS.indexOf(d))
  .replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d));

const $ = id => document.getElementById(id);
const nebulaEl = $('nebula');
const sky = $('sky');
const reader = $('reader');
const readerBox = $('readerBox');
const readerNum = $('readerNum');
const readerText = $('readerText');
const errEl = $('err');
const unlockStarEl = $('unlockStar');

/* ---------- starfield / warp canvas ---------- */
const canvas = $('field');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, fx, fy, stars = [];

const STAR_COUNT_DIVISOR = 4500;

function makeStar(){
  const ang = Math.random()*Math.PI*2;
  const dist = 40 + Math.random()*Math.max(W,H)*0.7;
  return {
    ang, dist,
    z: 0.35 + Math.random()*0.65,
    baseA: Math.random()*0.6 + 0.25,
    phase: Math.random()*Math.PI*2,
    twSpeed: Math.random()*0.006 + 0.002,
    r: Math.random()*1.2 + 0.3
  };
}

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W/2; cy = H/2;
  fx = cx; fy = cy;
  const count = Math.floor((W*H)/STAR_COUNT_DIVISOR);
  stars = Array.from({length: count}, () => makeStar());
  positionSky();
}

let warping = false;
let warpStart = 0;
let lastWarpElapsed = 0;
const WARP_DURATION = 1100;
const WARP_K = 4.2;
const WARP_Z_FLOOR = 0.02;

function project(s, zOverride){
  const z = zOverride !== undefined ? zOverride : s.z;
  const scale = 1/z;
  return { x: fx + Math.cos(s.ang)*s.dist*scale, y: fy + Math.sin(s.ang)*s.dist*scale, scale };
}

function warpZAt(elapsedMs, z0){
  const sec = elapsedMs/1000;
  return Math.max(WARP_Z_FLOOR, z0*Math.exp(-WARP_K*sec*sec));
}

/* constellation lines fade in/out toward consTarget */
let consAlpha = 0;
let consTarget = 0;

function drawFrame(t){
  ctx.clearRect(0,0,W,H);
  consAlpha += (consTarget - consAlpha) * 0.08;

  if(warping){
    const elapsed = t - warpStart;

    for(const s of stars){
      const beforeZ = warpZAt(lastWarpElapsed, s.warpZ0);
      const afterZ = warpZAt(elapsed, s.warpZ0);
      const before = project(s, beforeZ);
      const after = project(s, afterZ);
      const a = Math.min(0.85, 0.1 + after.scale*0.1);
      ctx.strokeStyle = `rgba(243,227,184,${a})`;
      ctx.lineWidth = Math.min(2.4, 0.3 + after.scale*0.3);
      ctx.beginPath();
      ctx.moveTo(before.x, before.y);
      ctx.lineTo(after.x, after.y);
      ctx.stroke();
    }
    lastWarpElapsed = elapsed;

    if(elapsed >= WARP_DURATION){
      warping = false;
      for(const s of stars){ s.z = 0.35 + Math.random()*0.65; s.dist = 40 + Math.random()*Math.max(W,H)*0.7; s.ang = Math.random()*Math.PI*2; }
      nebulaEl.style.opacity = '1';
      showConstellation();
    }
  } else {
    for(const s of stars){
      const tw = Math.sin(t*s.twSpeed + s.phase)*0.35;
      const a = Math.max(0, Math.min(1, s.baseA + tw));
      const pos = project(s);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(243,227,184,${a})`;
      ctx.fill();
    }

    if(consAlpha > 0.01 && nodes.length > 1){
      ctx.lineWidth = 1;
      ctx.strokeStyle = `rgba(243,227,184,${(0.28*consAlpha).toFixed(3)})`;
      ctx.beginPath();
      for(const [i, j] of edges){
        ctx.moveTo(nodes[i].nx*W, nodes[i].ny*H);
        ctx.lineTo(nodes[j].nx*W, nodes[j].ny*H);
      }
      ctx.stroke();
    }
  }
  requestAnimationFrame(drawFrame);
}

/* ---------- sentence data ---------- */
let sentences = [];
let ready = false;
let deck = [];

async function loadSentences(){
  try{
    const res = await fetch('1632.json?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('bad status');
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('empty');
    sentences = data;
    ready = true;
    $('listCount').textContent = fa(sentences.length);
    startWarp();
  }catch(e){
    errEl.innerHTML = 'فایل ۱۶۳۲.json پیدا نشد یا نامعتبر است.<br>باید کنار index.html و به‌صورت آرایه‌ای از رشته‌ها باشد.';
    errEl.hidden = false;
  }
}

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* draws without repeats until every sentence has appeared once */
function pickIndices(k){
  k = Math.min(k, sentences.length);
  if(deck.length < k) deck = shuffle(Array.from(sentences.keys()));
  return deck.splice(0, k);
}

/* ---------- constellation ---------- */
let nodes = [];   // { n, nx, ny, el }
let edges = [];   // [i, j]

function starCount(){
  return Math.max(9, Math.min(18, Math.round((W*H)/36000)));
}

function placePoints(k){
  const mx = Math.max(36, W*0.08);
  const top = Math.max(70, H*0.12);
  const bottom = H - Math.max(80, H*0.12);
  const w = W - 2*mx, h = bottom - top;
  let minD = Math.sqrt((w*h)/k) * 0.62;
  const pts = [];
  let fails = 0;
  while(pts.length < k){
    const x = mx + Math.random()*w;
    const y = top + Math.random()*h;
    if(pts.every(p => Math.hypot(p.x-x, p.y-y) >= minD)){
      pts.push({x, y});
      fails = 0;
    }else if(++fails > 60){
      minD *= 0.9;
      fails = 0;
    }
  }
  return pts.map(p => ({ nx: p.x/W, ny: p.y/H }));
}

/* connect the points into one tree: each new star joins its nearest connected neighbour */
function buildEdges(pts){
  const out = [];
  const inTree = [0];
  const rest = pts.map((_, i) => i).slice(1);
  while(rest.length){
    let best = null;
    for(const r of rest){
      for(const c of inTree){
        const d = Math.hypot((pts[r].nx-pts[c].nx)*W, (pts[r].ny-pts[c].ny)*H);
        if(!best || d < best.d) best = { d, r, c };
      }
    }
    out.push([best.c, best.r]);
    inTree.push(best.r);
    rest.splice(rest.indexOf(best.r), 1);
  }
  return out;
}

function buildSky(){
  sky.textContent = '';
  const idx = pickIndices(starCount());
  const pts = placePoints(idx.length);
  nodes = idx.map((n, i) => ({ n, nx: pts[i].nx, ny: pts[i].ny, el: null }));
  edges = buildEdges(pts);

  for(const node of nodes){
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'cstar';
    el.style.setProperty('--s', (14 + Math.random()*12).toFixed(1) + 'px');
    el.style.setProperty('--d', (2.4 + Math.random()*2.6).toFixed(2) + 's');
    el.style.setProperty('--dl', (-Math.random()*4).toFixed(2) + 's');
    el.setAttribute('aria-label', 'جمله‌ی ' + fa(node.n + 1));
    el.innerHTML = '<span class="g">✦</span><span class="n">' + fa(node.n + 1) + '</span>';
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      openReader(node);
    });
    node.el = el;
    sky.appendChild(el);
  }
  positionSky();
}

function positionSky(){
  for(const node of nodes){
    if(!node.el) continue;
    node.el.style.left = (node.nx*W).toFixed(1) + 'px';
    node.el.style.top = (node.ny*H).toFixed(1) + 'px';
  }
}

function showConstellation(){
  buildSky();
  sky.classList.remove('hidden', 'dim');
  consTarget = 1;
  scheduleAuto();
}

function startWarp(){
  if(!ready || warping) return;
  clearTimeout(autoTimer);
  for(const s of stars){ s.warpZ0 = s.z; }
  lastWarpElapsed = 0;
  warping = true;
  warpStart = performance.now();
  nebulaEl.style.opacity = '0.35';
  sky.classList.add('hidden');
  consTarget = 0;
}

/* ---------- reading one sentence ---------- */
let readerOpen = false;
let currentNode = null;
let openedCount = 0;

function openReader(node){
  clearTimeout(autoTimer);
  readerOpen = true;
  currentNode = node;

  readerNum.textContent = fa(node.n + 1) + ' از ' + fa(sentences.length);
  readerText.textContent = sentences[node.n];

  const dx = node.nx*W - cx;
  const dy = node.ny*H - cy;
  readerBox.style.transition = 'none';
  readerBox.style.transform = `translate(${dx}px, ${dy}px) scale(0.12)`;
  readerBox.style.opacity = '0';
  readerBox.style.filter = 'blur(10px)';
  void readerBox.offsetWidth; // force reflow so the transition below actually animates
  readerBox.style.transition = 'opacity .8s ease-out, filter .8s ease-out, transform .9s cubic-bezier(.16,1,.3,1)';
  readerBox.style.transform = 'translate(0px, 0px) scale(1)';
  readerBox.style.opacity = '1';
  readerBox.style.filter = 'blur(0px)';

  reader.classList.add('show');
  sky.classList.add('dim');
  consTarget = 0.2;

  openedCount++;
  if(openedCount >= 3) unlockStarEl.classList.add('show');
}

function closeReader(){
  if(!readerOpen) return;
  readerOpen = false;
  reader.classList.remove('show');
  readerBox.style.transition = 'opacity .25s ease';
  readerBox.style.opacity = '0';
  sky.classList.remove('dim');
  consTarget = 1;
  if(currentNode && currentNode.el) currentNode.el.classList.add('seen');
  currentNode = null;
  scheduleAuto();
}

/* ---------- body click: new constellation / close reader ---------- */
document.body.addEventListener('click', (e) => {
  if(readerOpen){ closeReader(); return; }
  if(listOpen) return;
  fx = e.clientX;
  fy = e.clientY;
  startWarp();
});

/* after 16.32 s of no interaction, drift on to a new constellation */
const AUTO_INTERVAL = 16320;
let autoTimer = null;
function scheduleAuto(){
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => {
    if(readerOpen || listOpen) return;
    fx = cx;
    fy = cy;
    startWarp();
  }, AUTO_INTERVAL);
}

/* ---------- all sentences, with number lookup ---------- */
const listOverlay = $('listOverlay');
const listBody = $('listBody');
const jumpInput = $('jumpInput');
const jumpMsg = $('jumpMsg');
const jumpResult = $('jumpResult');
let listOpen = false;
let listBuilt = false;
let hlRow = null;

function buildList(){
  if(listBuilt) return;
  const frag = document.createDocumentFragment();
  sentences.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = fa(i + 1);
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = text;
    row.append(num, txt);
    frag.appendChild(row);
  });
  listBody.appendChild(frag);
  listBuilt = true;
}

function openList(){
  if(!ready) return;
  clearTimeout(autoTimer);
  buildList();
  listOpen = true;
  listOverlay.classList.add('show');
}

function closeList(){
  if(!listOpen) return;
  listOpen = false;
  listOverlay.classList.remove('show');
  jumpInput.blur();
  scheduleAuto();
}

function jumpToNumber(){
  const raw = en(jumpInput.value).trim();
  const total = sentences.length;
  if(!/^\d+$/.test(raw)){
    jumpMsg.textContent = 'یه عدد بین ۱ تا ' + fa(total) + ' وارد کن.';
    jumpResult.hidden = true;
    return;
  }
  const n = parseInt(raw, 10);
  if(n < 1 || n > total){
    jumpMsg.textContent = 'جمله‌ای با این شماره نیست؛ عدد باید بین ۱ تا ' + fa(total) + ' باشه.';
    jumpResult.hidden = true;
    return;
  }
  jumpMsg.textContent = '';
  $('jumpResultNum').textContent = 'جمله‌ی ' + fa(n) + ' از ' + fa(total);
  $('jumpResultTxt').textContent = sentences[n - 1];
  jumpResult.hidden = false;

  const row = listBody.children[n - 1];
  if(hlRow) hlRow.classList.remove('hl');
  // restart the pulse animation even if the same row is picked twice
  void row.offsetWidth;
  row.classList.add('hl');
  hlRow = row;
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  jumpInput.blur();
}

unlockStarEl.addEventListener('click', (e) => {
  e.stopPropagation();
  openList();
});
$('listClose').addEventListener('click', (e) => {
  e.stopPropagation();
  closeList();
});
$('jumpBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  jumpToNumber();
});
jumpInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); jumpToNumber(); }
});
listOverlay.addEventListener('click', (e) => e.stopPropagation());

document.addEventListener('keydown', (e) => {
  if(e.key !== 'Escape') return;
  if(listOpen) closeList();
  else if(readerOpen) closeReader();
});

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(drawFrame);
loadSentences();
</script>
</body>
</html>

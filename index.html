<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>۱۶۳۲ سوال</title>
<style>
  :root{
    --void:#05060f;
    --deep:#0b0e24;
    --nebula:#3a2a6b;
    --nebula2:#1c3a5e;
    --star:#f3e3b8;
    --star-bright:#fff7e0;
    --ink:#eae6f5;
    --muted:#8a86a8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--void);
    color:var(--ink);
    font-family:"Vazirmatn","Vazir","IRANSans","Tahoma",sans-serif;
    overflow:hidden;
    position:relative;
  }
  canvas#field{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
  }
  .nebula{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse 55% 40% at 18% 22%, rgba(58,42,107,.55), transparent 60%),
      radial-gradient(ellipse 45% 35% at 82% 75%, rgba(28,58,94,.5), transparent 60%),
      radial-gradient(ellipse 60% 45% at 75% 15%, rgba(80,40,90,.3), transparent 65%);
    filter:blur(2px);
  }
  main{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: max(28px, env(safe-area-inset-top,0px)) 24px max(28px, env(safe-area-inset-bottom,0px));
    text-align:center;
  }
  .eyebrow{
    font-size:.8rem;
    letter-spacing:1px;
    color:var(--muted);
    margin:0 0 6px;
    font-weight:400;
  }
  .count{
    font-size:.75rem;
    color:var(--muted);
    margin:0 0 40px;
    min-height:1em;
  }
  .orb-wrap{
    position:relative;
    width:min(640px, 88vw);
    min-height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #sentence{
    font-size:clamp(1.15rem, 2.3vw + .6rem, 1.7rem);
    line-height:2.05;
    font-weight:400;
    max-width:38ch;
    margin:0 auto;
    opacity:0;
    filter:blur(6px);
    transition:opacity .55s ease, filter .55s ease;
    text-shadow:0 0 24px rgba(243,227,184,.15);
  }
  #sentence.show{opacity:1; filter:blur(0);}

  .travel-star{
    position:fixed;
    top:0; left:0;
    width:4px; height:4px;
    border-radius:50%;
    background:var(--star-bright);
    box-shadow:0 0 10px 2px var(--star-bright), 0 0 28px 6px rgba(243,227,184,.5);
    z-index:5;
    pointer-events:none;
    transition:transform .85s cubic-bezier(.2,.7,.2,1), opacity .5s ease .5s, width .85s ease, height .85s ease;
  }

  button{
    margin-top:38px;
    background:transparent;
    color:var(--star);
    border:1px solid rgba(243,227,184,.35);
    padding:11px 28px;
    border-radius:999px;
    font-size:.95rem;
    font-family:inherit;
    cursor:pointer;
    letter-spacing:.3px;
    transition:background .2s ease, border-color .2s ease, transform .1s ease;
  }
  button:hover{background:rgba(243,227,184,.08); border-color:rgba(243,227,184,.6);}
  button:active{transform:scale(.96);}

  .err{color:#e0a37a; font-size:1rem; opacity:1 !important; filter:none !important;}

  @media (prefers-reduced-motion: reduce){
    .travel-star{transition:opacity .3s ease;}
    #sentence{transition:opacity .3s ease;}
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="nebula"></div>
<main>
  <p class="eyebrow">۱۶۳۲ سوال</p>
  <p class="count" id="count"></p>
  <div class="orb-wrap">
    <p id="sentence"></p>
  </div>
  <button id="next">سوال بعدی</button>
</main>

<script>
/* ---------- starfield background ---------- */
const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d');
let W, H, stars = [];

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const count = Math.floor((W*H)/9000);
  stars = Array.from({length: count}, () => ({
    x: Math.random()*W,
    y: Math.random()*H,
    r: Math.random()*1.3 + 0.3,
    baseA: Math.random()*0.6 + 0.25,
    phase: Math.random()*Math.PI*2,
    speed: Math.random()*0.006 + 0.002
  }));
}
window.addEventListener('resize', resize);
resize();

function drawStars(t){
  ctx.clearRect(0,0,W,H);
  for(const s of stars){
    const tw = Math.sin(t*s.speed + s.phase)*0.35;
    const a = Math.max(0, Math.min(1, s.baseA + tw));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(243,227,184,${a})`;
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
requestAnimationFrame(drawStars);

/* ---------- sentence data ---------- */
let sentences = [];
const sentenceEl = document.getElementById('sentence');
const countEl = document.getElementById('count');
const orbWrap = document.querySelector('.orb-wrap');

async function loadSentences(){
  try{
    const res = await fetch('1632.json');
    if(!res.ok) throw new Error('bad status');
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('empty');
    sentences = data;
    countEl.textContent = sentences.length.toLocaleString('fa-IR') + ' سوال';
    revealNext();
  }catch(e){
    sentenceEl.innerHTML = '<span class="err">فایل ۱۶۳۲.json پیدا نشد یا نامعتبر است.<br>باید کنار index.html و به‌صورت آرایه‌ای از رشته‌ها باشد.</span>';
    sentenceEl.classList.add('show');
  }
}

/* ---------- shooting-star reveal ---------- */
function revealNext(){
  if(sentences.length === 0) return;

  sentenceEl.classList.remove('show');

  const rect = orbWrap.getBoundingClientRect();
  const targetX = rect.left + rect.width/2;
  const targetY = rect.top + rect.height/2;

  const angle = Math.random()*Math.PI*2;
  const dist = Math.max(W,H)*0.6;
  const startX = targetX + Math.cos(angle)*dist;
  const startY = targetY + Math.sin(angle)*dist;

  const star = document.createElement('div');
  star.className = 'travel-star';
  star.style.transform = `translate(${startX}px, ${startY}px)`;
  document.body.appendChild(star);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      star.style.transform = `translate(${targetX}px, ${targetY}px)`;
      star.style.width = '10px';
      star.style.height = '10px';
    });
  });

  setTimeout(() => {
    const i = Math.floor(Math.random()*sentences.length);
    sentenceEl.textContent = sentences[i];
    sentenceEl.classList.add('show');
    star.style.opacity = '0';
    setTimeout(() => star.remove(), 600);
  }, 780);
}

document.getElementById('next').addEventListener('click', revealNext);
loadSentences();
</script>
</body>
</html>

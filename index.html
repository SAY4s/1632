<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>۱۶۳۲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Blaka&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05060f;
    --nebula:#3a2a6b;
    --nebula2:#1c3a5e;
    --star:#f3e3b8;
    --star-bright:#fff7e0;
    --ink:#eae6f5;
    --muted:#8a86a8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--void);
    color:var(--ink);
    font-family:"Blaka","Vazirmatn","Tahoma",sans-serif;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  canvas#field{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
  }
  .nebula{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse 55% 40% at 18% 22%, rgba(58,42,107,.55), transparent 60%),
      radial-gradient(ellipse 45% 35% at 82% 75%, rgba(28,58,94,.5), transparent 60%),
      radial-gradient(ellipse 60% 45% at 75% 15%, rgba(80,40,90,.3), transparent 65%);
    filter:blur(2px);
    transition:opacity .5s ease;
  }
  main{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: max(28px, env(safe-area-inset-top,0px)) 24px max(28px, env(safe-area-inset-bottom,0px));
    text-align:center;
  }
  .orb-wrap{
    position:relative;
    width:min(640px, 88vw);
    min-height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #sentence{
    font-size:clamp(1.15rem, 2.3vw + .6rem, 1.7rem);
    line-height:2.05;
    font-weight:400;
    max-width:38ch;
    margin:0 auto;
    opacity:0;
    filter:blur(6px);
    transform:scale(.96);
    transition:opacity .6s ease, filter .6s ease, transform .6s ease;
    text-shadow:0 0 24px rgba(243,227,184,.15);
  }
  #sentence.show{opacity:1; filter:blur(0); transform:scale(1);}

  .err{color:#e0a37a; font-size:1rem;}

  @media (prefers-reduced-motion: reduce){
    #sentence{transition:opacity .3s ease;}
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="nebula" id="nebula"></div>
<main>
  <div class="orb-wrap">
    <p id="sentence"></p>
  </div>
</main>

<script>
/* ---------- starfield / warp canvas ---------- */
const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, stars = [];

const STAR_COUNT_DIVISOR = 4500;

function makeStar(nearCenter){
  const ang = Math.random()*Math.PI*2;
  const dist = (nearCenter ? Math.random()*40 : 40 + Math.random()*Math.max(W,H)*0.7);
  return {
    ang, dist,
    z: 0.35 + Math.random()*0.65,
    baseA: Math.random()*0.6 + 0.25,
    phase: Math.random()*Math.PI*2,
    twSpeed: Math.random()*0.006 + 0.002,
    r: Math.random()*1.2 + 0.3
  };
}

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W/2; cy = H/2;
  const count = Math.floor((W*H)/STAR_COUNT_DIVISOR);
  stars = Array.from({length: count}, () => makeStar(false));
}
window.addEventListener('resize', resize);
resize();

let warping = false;
let warpStart = 0;
const WARP_DURATION = 900;

function project(s){
  const scale = 1/s.z;
  return { x: cx + Math.cos(s.ang)*s.dist*scale, y: cy + Math.sin(s.ang)*s.dist*scale, scale };
}

function drawFrame(t){
  ctx.fillStyle = 'rgba(5,6,15,1)';
  ctx.clearRect(0,0,W,H);

  if(warping){
    const elapsed = t - warpStart;
    const p = Math.min(1, elapsed / WARP_DURATION);
    const ease = p*p*(3-2*p);
    const speed = 0.012 + ease*0.16;

    for(const s of stars){
      const before = project(s);
      s.z -= speed;
      if(s.z <= 0.03){
        s.z = 1;
        s.ang = Math.random()*Math.PI*2;
        s.dist = Math.random()*30;
      }
      const after = project(s);
      const a = Math.min(1, 0.15 + after.scale*0.18);
      ctx.strokeStyle = `rgba(243,227,184,${a})`;
      ctx.lineWidth = Math.min(3.5, 0.4 + after.scale*0.5);
      ctx.beginPath();
      ctx.moveTo(before.x, before.y);
      ctx.lineTo(after.x, after.y);
      ctx.stroke();
    }

    if(elapsed >= WARP_DURATION){
      warping = false;
      for(const s of stars){ s.z = 0.35 + Math.random()*0.65; s.dist = 40 + Math.random()*Math.max(W,H)*0.7; s.ang = Math.random()*Math.PI*2; }
      onWarpArrived();
    }
  } else {
    for(const s of stars){
      const tw = Math.sin(t*s.twSpeed + s.phase)*0.35;
      const a = Math.max(0, Math.min(1, s.baseA + tw));
      const pos = project(s);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(243,227,184,${a})`;
      ctx.fill();
    }
  }
  requestAnimationFrame(drawFrame);
}
requestAnimationFrame(drawFrame);

/* ---------- sentence data ---------- */
let sentences = [];
const sentenceEl = document.getElementById('sentence');
const nebulaEl = document.getElementById('nebula');
let pendingIndex = null;
let ready = false;

async function loadSentences(){
  try{
    const res = await fetch('1632.json?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('bad status');
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('empty');
    sentences = data;
    ready = true;
    startWarp();
  }catch(e){
    sentenceEl.innerHTML = '<span class="err">فایل ۱۶۳۲.json پیدا نشد یا نامعتبر است.<br>باید کنار index.html و به‌صورت آرایه‌ای از رشته‌ها باشد.</span>';
    sentenceEl.classList.add('show');
  }
}

function startWarp(){
  if(!ready || warping) return;
  sentenceEl.classList.remove('show');
  nebulaEl.style.opacity = '0.35';
  pendingIndex = Math.floor(Math.random()*sentences.length);
  warping = true;
  warpStart = performance.now();
}

function onWarpArrived(){
  sentenceEl.textContent = sentences[pendingIndex];
  sentenceEl.classList.add('show');
  nebulaEl.style.opacity = '1';
}

document.body.addEventListener('click', startWarp);

loadSentences();
</script>
</body>
</html>

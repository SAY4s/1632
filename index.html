<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>۱۶۳۲ سوال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05060f;
    --nebula:#3a2a6b;
    --nebula2:#1c3a5e;
    --star:#f3e3b8;
    --star-bright:#fff7e0;
    --ink:#eae6f5;
    --muted:#8a86a8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--void);
    color:var(--ink);
    font-family:"Lalezar","Vazirmatn","Tahoma",sans-serif;
    overflow:hidden;
    position:relative;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  button{font-family:inherit;}
  canvas#field{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    touch-action:none;
    cursor:grab;
  }
  canvas#field.grabbing{cursor:grabbing;}
  canvas#field.pointing{cursor:pointer;}
  .nebula{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse 55% 40% at 18% 22%, rgba(58,42,107,.55), transparent 60%),
      radial-gradient(ellipse 45% 35% at 82% 75%, rgba(28,58,94,.5), transparent 60%),
      radial-gradient(ellipse 60% 45% at 75% 15%, rgba(80,40,90,.3), transparent 65%);
    filter:blur(2px);
    transition:opacity .5s ease;
  }

  /* ---------- position indicator ---------- */
  .hud{
    position:fixed;
    left:50%;
    bottom:max(18px, env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);
    z-index:3;
    width:min(230px, 52vw);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    pointer-events:none;
    opacity:0;
    transition:opacity .8s ease;
  }
  .hud.show{opacity:1;}
  .hud-text{font-size:.78rem; color:var(--star); opacity:.75; white-space:nowrap;}
  .track{position:relative; width:100%; height:3px; border-radius:2px; background:rgba(243,227,184,.15);}
  .thumb{position:absolute; top:0; height:100%; width:14%; border-radius:2px; background:rgba(243,227,184,.75);}

  /* ---------- sentence reader ---------- */
  .reader{
    position:fixed;
    inset:0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(28px, env(safe-area-inset-top,0px)) 24px max(28px, env(safe-area-inset-bottom,0px));
    text-align:center;
    background:rgba(5,6,15,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    cursor:pointer;
  }
  .reader.show{opacity:1; pointer-events:auto;}
  .reader-box{
    width:min(640px, 88vw);
    opacity:0;
  }
  .reader-num{
    font-size:.95rem;
    color:var(--star);
    opacity:.75;
    margin-bottom:14px;
    letter-spacing:.04em;
  }
  .reader-text{
    margin:0 auto;
    font-size:clamp(1.15rem, 2.3vw + .6rem, 1.7rem);
    line-height:2.05;
    font-weight:400;
    max-width:38ch;
    text-shadow:0 0 24px rgba(243,227,184,.15);
  }

  .err{
    position:fixed;
    inset:0;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
    line-height:2;
    color:#e0a37a;
    font-size:1rem;
  }
  .err[hidden]{display:none;}

  /* ---------- unlock star + all-sentences list ---------- */
  .unlock-star{
    position:fixed;
    bottom:22px;
    left:22px;
    z-index:6;
    width:34px;
    height:34px;
    border:none;
    background:transparent;
    color:var(--star-bright);
    font-size:1.3rem;
    opacity:0;
    pointer-events:none;
    transform:scale(.5);
    transition:opacity .6s ease, transform .6s ease;
    text-shadow:0 0 10px rgba(243,227,184,.8), 0 0 22px rgba(243,227,184,.4);
    animation:pulseStar 2.4s ease-in-out infinite;
    cursor:pointer;
  }
  .unlock-star.show{opacity:1; pointer-events:auto; transform:scale(1);}
  @keyframes pulseStar{
    0%,100%{text-shadow:0 0 10px rgba(243,227,184,.8), 0 0 22px rgba(243,227,184,.4);}
    50%{text-shadow:0 0 16px rgba(243,227,184,1), 0 0 34px rgba(243,227,184,.7);}
  }

  .list-overlay{
    position:fixed;
    inset:0;
    z-index:8;
    display:flex;
    flex-direction:column;
    background:rgba(8,9,22,.96);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    cursor:default;
    user-select:text;
    -webkit-user-select:text;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .list-overlay.show{opacity:1; pointer-events:auto;}
  .list-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:max(12px, env(safe-area-inset-top,0px)) 14px 12px;
    border-bottom:1px solid rgba(243,227,184,.12);
  }
  .list-back{
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--star);
    font-size:1.2rem;
    cursor:pointer;
  }
  .list-title{flex:1; color:var(--star-bright); font-size:1rem;}
  .list-count{color:var(--muted); font-size:.85rem;}

  .jump-bar{
    display:flex;
    gap:8px;
    padding:10px 14px 6px;
  }
  .jump-input{
    flex:1;
    min-width:0;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(243,227,184,.18);
    outline:none;
    color:var(--ink);
    border-radius:20px;
    padding:9px 16px;
    font-size:16px;
    font-family:inherit;
    text-align:right;
  }
  .jump-input:focus{border-color:rgba(243,227,184,.5);}
  .jump-input::placeholder{color:var(--muted);}
  .jump-btn{
    border:none;
    border-radius:20px;
    padding:0 18px;
    background:rgba(243,227,184,.16);
    color:var(--star-bright);
    font-size:.92rem;
    cursor:pointer;
  }
  .jump-btn:active{background:rgba(243,227,184,.3);}
  .jump-msg{
    margin:0;
    padding:2px 18px 6px;
    min-height:1.4em;
    font-size:.8rem;
    color:#e0a37a;
  }
  .jump-result{
    margin:0 14px 8px;
    padding:12px 16px;
    border-radius:14px;
    background:rgba(243,227,184,.08);
    border:1px solid rgba(243,227,184,.28);
    line-height:2;
  }
  .jump-result[hidden]{display:none;}
  .jump-result .num{display:block; font-size:.8rem; color:var(--star); opacity:.8;}
  .jump-result .txt{font-size:1.05rem; color:var(--star-bright);}
  .sky-btn{
    display:inline-block;
    margin-top:6px;
    border:1px solid rgba(243,227,184,.35);
    border-radius:16px;
    padding:4px 14px;
    background:transparent;
    color:var(--star);
    font-size:.82rem;
    cursor:pointer;
  }
  .sky-btn:active{background:rgba(243,227,184,.18);}

  .list-body{
    flex:1;
    overflow-y:auto;
    padding:4px 14px max(16px, env(safe-area-inset-bottom,0px));
    -webkit-overflow-scrolling:touch;
  }
  .row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:10px 6px;
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .row .num{
    flex:0 0 3.2em;
    text-align:center;
    color:var(--star);
    opacity:.7;
    font-size:.82rem;
    padding-top:3px;
  }
  .row .txt{flex:1; font-size:.98rem; line-height:1.9; color:var(--ink);}
  .row.hl{
    background:rgba(243,227,184,.1);
    border-radius:10px;
    animation:hlPulse 1.6s ease-out 1;
  }
  @keyframes hlPulse{
    0%{box-shadow:0 0 0 2px rgba(243,227,184,.7);}
    100%{box-shadow:0 0 0 2px rgba(243,227,184,0);}
  }

  @media (prefers-reduced-motion: reduce){
    .unlock-star{animation:none;}
    .row.hl{animation:none;}
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="nebula" id="nebula"></div>

<div class="hud" id="hud" aria-hidden="true">
  <div class="hud-text" id="hudText"></div>
  <div class="track"><div class="thumb" id="thumb"></div></div>
</div>

<div class="reader" id="reader">
  <div class="reader-box" id="readerBox">
    <div class="reader-num" id="readerNum"></div>
    <p class="reader-text" id="readerText"></p>
  </div>
</div>

<p class="err" id="err" hidden></p>

<button class="unlock-star" id="unlockStar" aria-label="همه‌ی جمله‌ها">✦</button>

<div class="list-overlay" id="listOverlay" role="dialog" aria-label="همه‌ی جمله‌ها">
  <div class="list-header">
    <button class="list-back" id="listClose" aria-label="بستن">→</button>
    <div class="list-title">همه‌ی جمله‌ها</div>
    <div class="list-count" id="listCount"></div>
  </div>
  <div class="jump-bar">
    <input type="text" class="jump-input" id="jumpInput" inputmode="numeric" placeholder="شماره‌ی جمله" autocomplete="off">
    <button class="jump-btn" id="jumpBtn">نشون بده</button>
  </div>
  <p class="jump-msg" id="jumpMsg"></p>
  <div class="jump-result" id="jumpResult" hidden>
    <span class="num" id="jumpResultNum"></span>
    <span class="txt" id="jumpResultTxt"></span>
    <button class="sky-btn" id="skyBtn">✦ ببین توی آسمون کجاست</button>
  </div>
  <div class="list-body" id="listBody"></div>
</div>

<script>
/* ---------- helpers ---------- */
const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const fa = n => String(n).replace(/\d/g, d => FA_DIGITS[d]);
const en = s => String(s)
  .replace(/[۰-۹]/g, d => FA_DIGITS.indexOf(d))
  .replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const $ = id => document.getElementById(id);
const nebulaEl = $('nebula');
const reader = $('reader');
const readerBox = $('readerBox');
const readerNum = $('readerNum');
const readerText = $('readerText');
const errEl = $('err');
const unlockStarEl = $('unlockStar');
const hudEl = $('hud');
const hudText = $('hudText');
const thumbEl = $('thumb');

/* ---------- canvas + background starfield / warp ---------- */
const canvas = $('field');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, cx = 0, cy = 0, fx = 0, fy = 0, bgStars = [];

const STAR_COUNT_DIVISOR = 4500;

function makeBgStar(){
  const ang = Math.random()*Math.PI*2;
  const dist = 40 + Math.random()*Math.max(W,H)*0.7;
  return {
    ang, dist,
    z: 0.35 + Math.random()*0.65,
    baseA: Math.random()*0.6 + 0.25,
    phase: Math.random()*Math.PI*2,
    twSpeed: Math.random()*0.006 + 0.002,
    r: Math.random()*1.2 + 0.3
  };
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W*dpr);
  canvas.height = Math.round(H*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W/2; cy = H/2;
  fx = cx; fy = cy;
  const count = Math.floor((W*H)/STAR_COUNT_DIVISOR);
  bgStars = Array.from({length: count}, makeBgStar);
  layoutWorld();
}

let warping = false;
let warpStart = 0;
let lastWarpElapsed = 0;
const WARP_DURATION = 1100;
const WARP_K = 4.2;
const WARP_Z_FLOOR = 0.02;

function project(s, zOverride){
  const z = zOverride !== undefined ? zOverride : s.z;
  const scale = 1/z;
  return { x: fx + Math.cos(s.ang)*s.dist*scale, y: fy + Math.sin(s.ang)*s.dist*scale, scale };
}

function warpZAt(elapsedMs, z0){
  const sec = elapsedMs/1000;
  return Math.max(WARP_Z_FLOOR, z0*Math.exp(-WARP_K*sec*sec));
}

/* ---------- the wide sky: every sentence is one star ---------- */
let sentences = [];
let ready = false;       // sentences loaded
let worldReady = false;  // intro warp finished, sky can be dragged

const starsAll = [];     // { i, u, v, r, ph, sp, x, y }
const cells = [];        // constellations: { start, count, edges, col, row, x0, y0 }
const labels = [];
const seen = new Set();

let rows = 3, cols = 1, cellW = 200, cellH = 220;
let bandTop = 0, edgeX = 0, worldW = 0, maxCam = 0;
let camX = 0;
let firstLayout = true;

let worldAlpha = 0;
let worldTarget = 0;

function labelOf(i){
  return labels[i] || (labels[i] = fa(i + 1));
}

/* random points in the unit square, kept apart from each other */
function scatter(n){
  let minD = 0.78/Math.sqrt(n);
  const pts = [];
  let fails = 0;
  while(pts.length < n){
    const u = Math.random(), v = Math.random();
    if(pts.every(p => Math.hypot(p.u-u, p.v-v) >= minD)){
      pts.push({u, v});
      fails = 0;
    }else if(++fails > 80){
      minD *= 0.92;
      fails = 0;
    }
  }
  return pts;
}

/* join the points into one tree: each new star links to its nearest connected neighbour */
function minTree(pts){
  const out = [];
  const inTree = [0];
  const rest = pts.map((_, i) => i).slice(1);
  while(rest.length){
    let best = null;
    for(const r of rest){
      for(const c of inTree){
        const d = Math.hypot(pts[r].u-pts[c].u, pts[r].v-pts[c].v);
        if(!best || d < best.d) best = { d, r, c };
      }
    }
    out.push([best.c, best.r]);
    inTree.push(best.r);
    rest.splice(rest.indexOf(best.r), 1);
  }
  return out;
}

/* split the sentences into constellations of 6-10 consecutive numbers */
function buildWorldData(total){
  starsAll.length = 0;
  cells.length = 0;
  labels.length = 0;
  let i = 0;
  while(i < total){
    const remaining = total - i;
    let size = 6 + Math.floor(Math.random()*5);
    if(remaining - size < 4) size = remaining;
    const pts = scatter(size);
    for(let k = 0; k < size; k++){
      starsAll.push({
        i: i + k,
        u: pts[k].u,
        v: pts[k].v,
        r: 6 + Math.random()*5,
        ph: Math.random()*Math.PI*2,
        sp: 0.0015 + Math.random()*0.003,
        x: 0, y: 0
      });
    }
    cells.push({
      start: i,
      count: size,
      edges: size > 1 ? minTree(pts).map(([a, b]) => [i + a, i + b]) : [],
      col: 0, row: 0, x0: 0, y0: 0
    });
    i += size;
  }
}

/* constellations fill the sky column by column; number 1 sits at the right edge (RTL) */
function layoutWorld(){
  if(!starsAll.length) return;
  const progress = maxCam > 0 ? camX/maxCam : 1;

  bandTop = Math.max(64, H*0.10);
  const bandBottom = H - Math.max(78, H*0.11);
  const bandH = Math.max(240, bandBottom - bandTop);
  rows = Math.max(2, Math.round(bandH/210));
  cellH = bandH/rows;
  cellW = clamp(cellH*0.95, 170, 260);
  cols = Math.ceil(cells.length/rows);
  edgeX = W*0.25;
  worldW = cols*cellW + 2*edgeX;
  maxCam = Math.max(0, worldW - W);

  const padX = Math.min(26, cellW*0.12);
  const padY = Math.min(26, cellH*0.12);
  cells.forEach((cell, k) => {
    cell.col = Math.floor(k/rows);
    cell.row = k % rows;
    cell.x0 = edgeX + (cols - 1 - cell.col)*cellW;
    cell.y0 = bandTop + cell.row*cellH;
    for(let i = cell.start; i < cell.start + cell.count; i++){
      const s = starsAll[i];
      s.x = cell.x0 + padX + s.u*(cellW - 2*padX);
      s.y = cell.y0 + padY + s.v*(cellH - 2*padY);
    }
  });

  camX = firstLayout ? maxCam : clamp(progress*maxCam, 0, maxCam);
  firstLayout = false;
}

/* ---------- drawing the sky ---------- */
function makeHalo(rgb){
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, `rgba(${rgb},0.55)`);
  grad.addColorStop(0.35, `rgba(${rgb},0.18)`);
  grad.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return c;
}
const haloGold = makeHalo('243,227,184');
const haloViolet = makeHalo('170,150,255');

function drawStarShape(x, y, r){
  const k = r*0.18;
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x + k, y - k, x + r, y);
  ctx.quadraticCurveTo(x + k, y + k, x, y + r);
  ctx.quadraticCurveTo(x - k, y + k, x - r, y);
  ctx.quadraticCurveTo(x - k, y - k, x, y - r);
  ctx.closePath();
  ctx.fill();
}

let hoveredIdx = -1;
let pulse = null; // { i, t0 }

function cellVisible(cell, margin){
  const left = cell.x0 - camX;
  return left < W + margin && left + cellW > -margin;
}

function drawWorld(t){
  if(worldAlpha < 0.01 || !starsAll.length) return;
  ctx.save();
  ctx.globalAlpha = worldAlpha;

  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(243,227,184,0.26)';
  ctx.beginPath();
  for(const cell of cells){
    if(!cellVisible(cell, 40)) continue;
    for(const [a, b] of cell.edges){
      const A = starsAll[a], B = starsAll[b];
      ctx.moveTo(A.x - camX, A.y);
      ctx.lineTo(B.x - camX, B.y);
    }
  }
  ctx.stroke();

  ctx.font = '10px Lalezar, Vazirmatn, Tahoma, sans-serif';
  ctx.textAlign = 'center';
  for(const cell of cells){
    if(!cellVisible(cell, 40)) continue;
    for(let i = cell.start; i < cell.start + cell.count; i++){
      const s = starsAll[i];
      const sx = s.x - camX;
      if(sx < -30 || sx > W + 30) continue;
      const isSeen = seen.has(s.i);
      const hov = hoveredIdx === s.i;
      const r = s.r*(hov ? 1.35 : 1);
      const tw = 0.78 + 0.22*Math.sin(t*s.sp + s.ph);

      ctx.globalAlpha = worldAlpha*tw;
      const halo = r*5;
      ctx.drawImage(isSeen ? haloViolet : haloGold, sx - halo/2, s.y - halo/2, halo, halo);
      ctx.fillStyle = isSeen ? '#cdb9ff' : '#fff7e0';
      drawStarShape(sx, s.y, r);

      ctx.globalAlpha = worldAlpha*(hov ? 0.95 : 0.55);
      ctx.fillStyle = isSeen ? 'rgb(205,185,255)' : 'rgb(243,227,184)';
      ctx.fillText(labelOf(s.i), sx, s.y + r + 13);
    }
  }

  if(pulse){
    const el = t - pulse.t0;
    if(el > 2600){
      pulse = null;
    }else{
      const s = starsAll[pulse.i];
      const sx = s.x - camX;
      ctx.lineWidth = 1.5;
      for(let k = 0; k < 3; k++){
        const p = ((el - k*350)/1600);
        if(p < 0 || p > 1) continue;
        ctx.globalAlpha = worldAlpha*(1 - p)*0.85;
        ctx.strokeStyle = '#fff7e0';
        ctx.beginPath();
        ctx.arc(sx, s.y, 14 + p*48, 0, Math.PI*2);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

/* ---------- camera: drag, inertia, wheel, keys, animated pans ---------- */
let dragging = false;
let dragId = null;
let startX = 0, startY = 0, lastX = 0, lastT = 0, moved = 0;
let vel = 0; // px per ms, positive = camera moves right
let panAnim = null;
let hintGone = false;

function setCam(v){
  const c = clamp(v, 0, maxCam);
  if(c !== v) vel = 0;
  camX = c;
}

function panTo(target, dur){
  panAnim = { from: camX, to: clamp(target, 0, maxCam), t0: performance.now(), dur: dur || 900 };
  vel = 0;
}

function stepCamera(t, dt){
  if(panAnim){
    const p = Math.min(1, (t - panAnim.t0)/panAnim.dur);
    const e = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
    camX = panAnim.from + (panAnim.to - panAnim.from)*e;
    if(p >= 1) panAnim = null;
  }else if(!dragging && Math.abs(vel) > 0.01){
    setCam(camX + vel*dt);
    vel *= Math.pow(0.94, dt/16.67);
  }
}

function hitTest(px, py, radius){
  let best = -1, bestD = radius;
  for(const cell of cells){
    if(!cellVisible(cell, 0)) continue;
    for(let i = cell.start; i < cell.start + cell.count; i++){
      const s = starsAll[i];
      const d = Math.hypot(s.x - camX - px, s.y - py);
      if(d < bestD){ bestD = d; best = s.i; }
    }
  }
  return best;
}

canvas.addEventListener('pointerdown', (e) => {
  if(!worldReady || readerOpen || listOpen || dragId !== null) return;
  dragId = e.pointerId;
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  dragging = true;
  startX = lastX = e.clientX;
  startY = e.clientY;
  lastT = performance.now();
  moved = 0;
  vel = 0;
  panAnim = null;
  canvas.classList.add('grabbing');
});

canvas.addEventListener('pointermove', (e) => {
  if(dragging && e.pointerId === dragId){
    const now = performance.now();
    const dx = e.clientX - lastX;
    const dt = Math.max(1, now - lastT);
    setCam(camX - dx);
    moved = Math.max(moved, Math.hypot(e.clientX - startX, e.clientY - startY));
    vel = vel*0.6 + (-dx/dt)*0.4;
    lastX = e.clientX;
    lastT = now;
    if(moved > 20) hintGone = true;
  }else if(e.pointerType === 'mouse' && worldReady && !readerOpen && !listOpen){
    hoveredIdx = hitTest(e.clientX, e.clientY, 22);
    canvas.classList.toggle('pointing', hoveredIdx >= 0);
  }
});

function endDrag(e){
  if(!dragging || e.pointerId !== dragId) return;
  dragging = false;
  dragId = null;
  canvas.classList.remove('grabbing');
  try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
  const quick = performance.now() - lastT;
  if(e.type === 'pointerup' && moved < 8){
    vel = 0;
    const radius = e.pointerType === 'mouse' ? 24 : 32;
    const i = hitTest(e.clientX, e.clientY, radius);
    if(i >= 0) openReader(starsAll[i]);
  }else if(quick > 80){
    vel = 0;
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', () => {
  if(!dragging){ hoveredIdx = -1; canvas.classList.remove('pointing'); }
});

canvas.addEventListener('wheel', (e) => {
  if(!worldReady || readerOpen || listOpen) return;
  e.preventDefault();
  panAnim = null;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  setCam(camX - d);
  hintGone = true;
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    if(listOpen) closeList();
    else if(readerOpen) closeReader();
    return;
  }
  if(!worldReady || readerOpen || listOpen) return;
  if(e.key === 'ArrowLeft'){ panTo((panAnim ? panAnim.to : camX) - W*0.7, 500); hintGone = true; }
  else if(e.key === 'ArrowRight'){ panTo((panAnim ? panAnim.to : camX) + W*0.7, 500); hintGone = true; }
});

/* ---------- HUD ---------- */
let hudLast = '';
function updateHud(){
  if(!worldReady) return;
  let text;
  if(!hintGone){
    text = 'برای دیدن بقیه‌ی ستاره‌ها بکش';
  }else{
    let lo = Infinity, hi = -1;
    for(const cell of cells){
      if(!cellVisible(cell, 0)) continue;
      for(let i = cell.start; i < cell.start + cell.count; i++){
        const sx = starsAll[i].x - camX;
        if(sx >= 0 && sx <= W){ if(i < lo) lo = i; if(i > hi) hi = i; }
      }
    }
    text = hi >= 0 ? fa(lo + 1) + ' تا ' + fa(hi + 1) : '';
  }
  if(text !== hudLast){ hudText.textContent = text; hudLast = text; }
  const p = maxCam > 0 ? 1 - camX/maxCam : 0;
  thumbEl.style.right = (p*86).toFixed(2) + '%';
}

/* ---------- main loop ---------- */
let lastFrame = 0;
function drawFrame(t){
  const dt = lastFrame ? Math.min(50, t - lastFrame) : 16;
  lastFrame = t;
  ctx.clearRect(0, 0, W, H);
  worldAlpha += (worldTarget - worldAlpha)*0.1;
  stepCamera(t, dt);

  if(warping){
    const elapsed = t - warpStart;
    for(const s of bgStars){
      const beforeZ = warpZAt(lastWarpElapsed, s.warpZ0);
      const afterZ = warpZAt(elapsed, s.warpZ0);
      const before = project(s, beforeZ);
      const after = project(s, afterZ);
      const a = Math.min(0.85, 0.1 + after.scale*0.1);
      ctx.strokeStyle = `rgba(243,227,184,${a})`;
      ctx.lineWidth = Math.min(2.4, 0.3 + after.scale*0.3);
      ctx.beginPath();
      ctx.moveTo(before.x, before.y);
      ctx.lineTo(after.x, after.y);
      ctx.stroke();
    }
    lastWarpElapsed = elapsed;

    if(elapsed >= WARP_DURATION){
      warping = false;
      for(const s of bgStars){ s.z = 0.35 + Math.random()*0.65; s.dist = 40 + Math.random()*Math.max(W,H)*0.7; s.ang = Math.random()*Math.PI*2; }
      nebulaEl.style.opacity = '1';
      worldReady = true;
      worldTarget = 1;
      hudEl.classList.add('show');
    }
  }else{
    // slow parallax: the background drifts a little as the sky is dragged
    const par = -camX*0.1;
    for(const s of bgStars){
      const tw = Math.sin(t*s.twSpeed + s.phase)*0.35;
      const a = Math.max(0, Math.min(1, s.baseA + tw));
      const pos = project(s);
      const x = (((pos.x + par*s.z) % W) + W) % W;
      ctx.beginPath();
      ctx.arc(x, pos.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(243,227,184,${a})`;
      ctx.fill();
    }
    drawWorld(t);
    updateHud();
  }
  requestAnimationFrame(drawFrame);
}

function startWarp(){
  if(!ready || warping) return;
  for(const s of bgStars){ s.warpZ0 = s.z; }
  lastWarpElapsed = 0;
  warping = true;
  warpStart = performance.now();
  nebulaEl.style.opacity = '0.35';
  worldTarget = 0;
}

/* ---------- loading ---------- */
async function loadSentences(){
  try{
    const res = await fetch('1632.json?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('bad status');
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('empty');
    sentences = data;
    buildWorldData(sentences.length);
    layoutWorld();
    ready = true;
    $('listCount').textContent = fa(sentences.length);
    startWarp();
  }catch(e){
    errEl.innerHTML = 'فایل ۱۶۳۲.json پیدا نشد یا نامعتبر است.<br>باید کنار index.html و به‌صورت آرایه‌ای از رشته‌ها باشد.';
    errEl.hidden = false;
  }
}

/* ---------- reading one sentence ---------- */
let readerOpen = false;
let readerOpenedAt = 0;
let currentStar = null;
let openedCount = 0;

function openReader(star){
  readerOpen = true;
  readerOpenedAt = performance.now();
  currentStar = star;
  hoveredIdx = -1;
  canvas.classList.remove('pointing');

  readerNum.textContent = fa(star.i + 1) + ' از ' + fa(sentences.length);
  readerText.textContent = sentences[star.i];

  const dx = (star.x - camX) - cx;
  const dy = star.y - cy;
  readerBox.style.transition = 'none';
  readerBox.style.transform = `translate(${dx}px, ${dy}px) scale(0.12)`;
  readerBox.style.opacity = '0';
  readerBox.style.filter = 'blur(10px)';
  void readerBox.offsetWidth; // force reflow so the transition below actually animates
  readerBox.style.transition = 'opacity .8s ease-out, filter .8s ease-out, transform .9s cubic-bezier(.16,1,.3,1)';
  readerBox.style.transform = 'translate(0px, 0px) scale(1)';
  readerBox.style.opacity = '1';
  readerBox.style.filter = 'blur(0px)';

  reader.classList.add('show');
  worldTarget = 0.2;

  openedCount++;
  if(openedCount >= 3) unlockStarEl.classList.add('show');
}

function closeReader(){
  if(!readerOpen) return;
  readerOpen = false;
  reader.classList.remove('show');
  readerBox.style.transition = 'opacity .25s ease';
  readerBox.style.opacity = '0';
  worldTarget = 1;
  if(currentStar) seen.add(currentStar.i);
  currentStar = null;
}

reader.addEventListener('click', () => {
  // ignore the synthetic click that follows the tap which opened the reader
  if(performance.now() - readerOpenedAt < 350) return;
  closeReader();
});

/* ---------- all sentences, with number lookup ---------- */
const listOverlay = $('listOverlay');
const listBody = $('listBody');
const jumpInput = $('jumpInput');
const jumpMsg = $('jumpMsg');
const jumpResult = $('jumpResult');
let listOpen = false;
let listBuilt = false;
let hlRow = null;
let jumpedNumber = 0;

function buildList(){
  if(listBuilt) return;
  const frag = document.createDocumentFragment();
  sentences.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = fa(i + 1);
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = text;
    row.append(num, txt);
    frag.appendChild(row);
  });
  listBody.appendChild(frag);
  listBuilt = true;
}

function openList(){
  if(!ready) return;
  buildList();
  listOpen = true;
  dragging = false;
  dragId = null;
  listOverlay.classList.add('show');
}

function closeList(){
  if(!listOpen) return;
  listOpen = false;
  listOverlay.classList.remove('show');
  jumpInput.blur();
}

function jumpToNumber(){
  const raw = en(jumpInput.value).trim();
  const total = sentences.length;
  if(!/^\d+$/.test(raw)){
    jumpMsg.textContent = 'یه عدد بین ۱ تا ' + fa(total) + ' وارد کن.';
    jumpResult.hidden = true;
    return;
  }
  const n = parseInt(raw, 10);
  if(n < 1 || n > total){
    jumpMsg.textContent = 'جمله‌ای با این شماره نیست؛ عدد باید بین ۱ تا ' + fa(total) + ' باشه.';
    jumpResult.hidden = true;
    return;
  }
  jumpMsg.textContent = '';
  jumpedNumber = n;
  $('jumpResultNum').textContent = 'جمله‌ی ' + fa(n) + ' از ' + fa(total);
  $('jumpResultTxt').textContent = sentences[n - 1];
  jumpResult.hidden = false;

  const row = listBody.children[n - 1];
  if(hlRow) hlRow.classList.remove('hl');
  // restart the pulse animation even if the same row is picked twice
  void row.offsetWidth;
  row.classList.add('hl');
  hlRow = row;
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  jumpInput.blur();
}

/* close the list and fly the camera to that star */
function showInSky(){
  if(!jumpedNumber) return;
  const star = starsAll[jumpedNumber - 1];
  closeList();
  hintGone = true;
  panTo(star.x - W/2, 1200);
  pulse = { i: star.i, t0: performance.now() };
}

unlockStarEl.addEventListener('click', openList);
$('listClose').addEventListener('click', closeList);
$('jumpBtn').addEventListener('click', jumpToNumber);
$('skyBtn').addEventListener('click', showInSky);
jumpInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); jumpToNumber(); }
});

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(drawFrame);
loadSentences();
</script>
</body>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tool Files</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
}

header {
    padding: 25px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
}

header h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

header p {
    margin: 0;
    color: #8b949e;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.search {
    flex: 1;
    padding: 13px 16px;
    border-radius: 10px;
    border: 1px solid #30363d;
    background: #161b22;
    color: white;
    outline: none;
    font-size: 14px;
}

.search:focus {
    border-color: #58a6ff;
}

button {
    border: 1px solid #30363d;
    background: #21262d;
    color: white;
    border-radius: 10px;
    padding: 10px 17px;
    cursor: pointer;
}

button:hover {
    background: #30363d;
}

.path {
    color: #8b949e;
    margin-bottom: 18px;
    font-size: 14px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 15px;
}

.card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 13px;
    overflow: hidden;
    cursor: pointer;
    transition: .2s;
}

.card:hover {
    transform: translateY(-3px);
    border-color: #58a6ff;
}

.icon {
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
    background: #0d1117;
}

.info {
    padding: 13px;
}

.name {
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.type {
    margin-top: 7px;
    color: #8b949e;
    font-size: 12px;
}

.status {
    padding: 50px;
    text-align: center;
    color: #8b949e;
}

.error {
    color: #ff7b72;
}

.back {
    display: none;
    margin-bottom: 15px;
}

@media(max-width:600px) {
    .container {
        padding: 15px;
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <h1>📁 SAY4s / 1632 / tool</h1>
    <p>فایل‌های موجود در پوشه Tool</p>
</header>

<div class="container">

    <div class="toolbar">

        <input
            id="search"
            class="search"
            placeholder="🔍 جستجوی فایل..."
        >

        <button onclick="loadFiles()">
            🔄 بروزرسانی
        </button>

    </div>

    <button
        id="backButton"
        class="back"
        onclick="goBack()">
        ← برگشت
    </button>

    <div id="path" class="path">
        📁 tool
    </div>

    <div id="files" class="grid">
        <div class="status">
            در حال دریافت فایل‌ها...
        </div>
    </div>

</div>

<script>

const OWNER = "SAY4s";
const REPO = "1632";
const BRANCH = "main";

let currentPath = "tool";
let history = [];

let allItems = [];

const filesContainer =
    document.getElementById("files");

const searchInput =
    document.getElementById("search");

const pathElement =
    document.getElementById("path");

const backButton =
    document.getElementById("backButton");


// دریافت محتویات پوشه
async function loadFiles(path = currentPath) {

    currentPath = path;

    filesContainer.innerHTML = `
        <div class="status">
            ⏳ در حال دریافت فایل‌ها...
        </div>
    `;

    try {

        const api =
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;

        const response =
            await fetch(api);

        if (!response.ok) {
            throw new Error(
                "خطا در دریافت اطلاعات GitHub"
            );
        }

        const data =
            await response.json();

        allItems = data;

        updatePath();

        render(data);

    } catch (error) {

        filesContainer.innerHTML = `
            <div class="status error">
                ❌ دریافت فایل‌ها با خطا مواجه شد
                <br><br>
                ${error.message}
            </div>
        `;

    }

}


// نمایش فایل‌ها
function render(items) {

    const query =
        searchInput.value
        .toLowerCase()
        .trim();

    if (query) {

        items = items.filter(item =>
            item.name.toLowerCase().includes(query)
        );

    }

    // اول پوشه‌ها
    items.sort((a, b) => {

        if (a.type === b.type)
            return a.name.localeCompare(b.name);

        return a.type === "dir" ? -1 : 1;

    });

    if (!items.length) {

        filesContainer.innerHTML = `
            <div class="status">
                فایلی پیدا نشد
            </div>
        `;

        return;
    }

    filesContainer.innerHTML = "";

    items.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "card";

        const icon =
            document.createElement("div");

        icon.className = "icon";

        icon.textContent =
            item.type === "dir"
                ? "📁"
                : getIcon(item.name);

        const info =
            document.createElement("div");

        info.className = "info";

        const name =
            document.createElement("div");

        name.className = "name";

        name.textContent = item.name;

        const type =
            document.createElement("div");

        type.className = "type";

        type.textContent =
            item.type === "dir"
                ? "پوشه"
                : getExtension(item.name);

        info.appendChild(name);
        info.appendChild(type);

        card.appendChild(icon);
        card.appendChild(info);

        card.onclick = () => {

            if (item.type === "dir") {

                history.push(currentPath);

                loadFiles(item.path);

            } else {

                openFile(item);

            }

        };

        filesContainer.appendChild(card);

    });

}


// باز کردن فایل
function openFile(item) {

    window.open(
        item.html_url,
        "_blank"
    );

}


// مسیر فعلی
function updatePath() {

    pathElement.innerHTML =
        "📁 " + currentPath;

    backButton.style.display =
        history.length
            ? "inline-block"
            : "none";

}


// برگشت
function goBack() {

    if (!history.length)
        return;

    const previous =
        history.pop();

    loadFiles(previous);

}


// جستجو
searchInput.addEventListener(
    "input",
    () => render(allItems)
);


// پسوند فایل
function getExtension(name) {

    const parts =
        name.split(".");

    if (parts.length === 1)
        return "فایل";

    return (
        "." +
        parts.pop().toLowerCase()
    );

}


// آیکون فایل
function getIcon(name) {

    const ext =
        getExtension(name);

    const icons = {

        ".html": "🌐",
        ".htm": "🌐",

        ".css": "🎨",

        ".js": "📜",

        ".json": "🗃️",

        ".txt": "📄",

        ".md": "📝",

        ".pdf": "📕",

        ".jpg": "🖼️",
        ".jpeg": "🖼️",
        ".png": "🖼️",
        ".gif": "🖼️",
        ".webp": "🖼️",
        ".svg": "🖼️",

        ".mp4": "🎬",
        ".webm": "🎬",
        ".mkv": "🎬",

        ".mp3": "🎵",
        ".wav": "🎵",

        ".zip": "🗜️",
        ".rar": "🗜️",
        ".7z": "🗜️",

        ".py": "🐍",

        ".exe": "⚙️",

        ".doc": "📘",
        ".docx": "📘",

        ".xls": "📊",
        ".xlsx": "📊",

        ".ppt": "📙",
        ".pptx": "📙"

    };

    return icons[ext] || "📄";

}


// شروع
loadFiles();

</script>

</body>
</html>

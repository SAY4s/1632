<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GitHub File Explorer</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#0d1117;
    color:#e6edf3;
}

header{
    padding:25px;
    background:#161b22;
    border-bottom:1px solid #30363d;
}

header h1{
    margin:0 0 8px;
    font-size:25px;
}

header p{
    margin:0;
    color:#8b949e;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:25px;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.search{
    flex:1;
    padding:13px 16px;
    border-radius:10px;
    border:1px solid #30363d;
    background:#161b22;
    color:white;
    outline:none;
    font-size:14px;
}

.search:focus{
    border-color:#58a6ff;
}

button{
    border:1px solid #30363d;
    background:#21262d;
    color:white;
    padding:11px 17px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#30363d;
}

.path{
    color:#8b949e;
    margin-bottom:15px;
    font-size:14px;
}

.back{
    display:none;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:15px;
}

.card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:13px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#58a6ff;
}

.preview{
    height:145px;
    background:#0d1117;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}

.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.icon{
    font-size:58px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.icon svg{
    width:68px;
    height:68px;
    display:block;
    transition:transform .2s ease;
}

.card:hover .icon svg{
    transform:scale(1.08);
}

.info{
    padding:13px;
}

.name{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.meta{
    margin-top:7px;
    color:#8b949e;
    font-size:12px;
}

.status{
    text-align:center;
    padding:70px 20px;
    color:#8b949e;
}

.error{
    color:#ff7b72;
}

.badge{
    position:absolute;
    top:8px;
    left:8px;
    padding:4px 7px;
    border-radius:6px;
    background:#238636;
    color:white;
    font-size:10px;
}

.viewer{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#0d1117;
    overflow:auto;
}

.viewer-header{
    height:65px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 18px;
    position:sticky;
    top:0;
    z-index:2;
}

.viewer-title{
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.viewer-content{
    padding:20px;
    min-height:calc(100vh - 65px);
}

.viewer img{
    max-width:100%;
    max-height:80vh;
    display:block;
    margin:auto;
}

.viewer video{
    width:100%;
    max-height:80vh;
}

.viewer audio{
    width:100%;
}

.viewer iframe{
    width:100%;
    height:85vh;
    border:0;
    background:white;
}

.viewer pre{
    direction:ltr;
    text-align:left;
    white-space:pre-wrap;
    word-break:break-word;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:10px;
    padding:20px;
    overflow:auto;
    line-height:1.6;
}

.file-info{
    max-width:700px;
    margin:50px auto;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:15px;
    padding:25px;
}

.file-info h2{
    margin-top:0;
}

.file-info-row{
    padding:10px 0;
    border-bottom:1px solid #30363d;
}

.download{
    display:inline-block;
    margin-top:20px;
    padding:12px 18px;
    border-radius:9px;
    background:#238636;
    color:white;
    text-decoration:none;
}

.download:hover{
    background:#2ea043;
}

@media(max-width:600px){

    .container{
        padding:15px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .toolbar{
        flex-direction:column;
    }

}
</style>
</head>

<body>

<header>
    <h1>📁 SAY4s / 1632 / tool</h1>
    <p>مرورگر فایل GitHub</p>
</header>

<div class="container">

    <div class="toolbar">

        <input
            id="search"
            class="search"
            placeholder="🔍 جستجوی فایل..."
        >

        <button onclick="refresh()">
            🔄 بروزرسانی
        </button>

    </div>

    <button
        id="back"
        class="back"
        onclick="goBack()">
        ← برگشت
    </button>

    <div id="path" class="path">
        📁 tool
    </div>

    <div id="files" class="grid">

        <div class="status">
            ⏳ در حال دریافت فایل‌ها...
        </div>

    </div>

</div>


<!-- Viewer -->

<div id="viewer" class="viewer">

    <div class="viewer-header">

        <button onclick="closeViewer()">
            ✕ بستن
        </button>

        <div
            id="viewerTitle"
            class="viewer-title">
        </div>

        <a
            id="githubLink"
            target="_blank"
            style="text-decoration:none"
        >
            <button>
                GitHub
            </button>
        </a>

    </div>

    <div
        id="viewerContent"
        class="viewer-content">
    </div>

</div>


<script>

/* =========================
   تنظیمات
========================= */

const OWNER = "SAY4s";

const REPO = "1632";

const BRANCH = "main";

const ROOT = "tool";


/* =========================
   متغیرها
========================= */

let currentPath = ROOT;

let history = [];

let allItems = [];


/* =========================
   عناصر
========================= */

const files =
    document.getElementById("files");

const search =
    document.getElementById("search");

const path =
    document.getElementById("path");

const back =
    document.getElementById("back");

const viewer =
    document.getElementById("viewer");

const viewerContent =
    document.getElementById("viewerContent");

const viewerTitle =
    document.getElementById("viewerTitle");

const githubLink =
    document.getElementById("githubLink");


/* =========================
   URLهای GitHub
========================= */

function rawURL(item){

    return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${item.path}`;

}

function githubURL(item){

    return item.html_url;

}


/* =========================
   دریافت پوشه
========================= */

async function loadFiles(folder=currentPath){

    currentPath = folder;

    files.innerHTML = `
        <div class="status">
            ⏳ در حال دریافت...
        </div>
    `;

    try{

        const url =
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(folder)}?ref=${BRANCH}`;

        const response =
            await fetch(url);

        if(!response.ok){

            throw new Error(
                "خطا در ارتباط با GitHub"
            );

        }

        const data =
            await response.json();

        if(!Array.isArray(data)){

            throw new Error(
                "مسیر موردنظر پوشه نیست."
            );

        }

        allItems = data;

        updatePath();

        render(data);

    }catch(error){

        files.innerHTML = `
            <div class="status error">
                ❌ ${escapeHTML(error.message)}
            </div>
        `;

    }

}


/* =========================
   نمایش فایل‌ها
========================= */

function render(items){

    const q =
        search.value
        .trim()
        .toLowerCase();

    if(q){

        items =
            items.filter(item =>
                item.name
                .toLowerCase()
                .includes(q)
            );

    }

    items.sort((a,b)=>{

        if(a.type===b.type){

            return a.name.localeCompare(
                b.name,
                "fa"
            );

        }

        return a.type==="dir" ? -1 : 1;

    });

    if(!items.length){

        files.innerHTML = `
            <div class="status">
                📭 فایلی پیدا نشد
            </div>
        `;

        return;

    }

    files.innerHTML = "";

    items.forEach(item=>{

        const card =
            document.createElement("div");

        card.className="card";


        const preview =
            document.createElement("div");

        preview.className="preview";


        /* پوشه */

        if(item.type==="dir"){

            preview.innerHTML =
                `<div class="icon">📁</div>`;

        }


        /* تصویر */

        else if(isImage(item.name)){

            const img =
                document.createElement("img");

            img.src = rawURL(item);

            img.loading="lazy";

            img.onerror=()=>{

                preview.innerHTML =
                    `<div class="icon">
                        ${getIcon(item.name)}
                    </div>`;

            };

            preview.appendChild(img);

        }


        /* HTML */

        else if(isHTML(item.name)){

            preview.innerHTML =
                `<div class="icon">${getToolIcon(item.name)}</div>`;

            preview.innerHTML +=
                `<div class="badge">
                    HTML قابل اجرا
                </div>`;

        }


        /* ویدئو */

        else if(isVideo(item.name)){

            preview.innerHTML =
                `<div class="icon">🎬</div>`;

        }


        /* صوت */

        else if(isAudio(item.name)){

            preview.innerHTML =
                `<div class="icon">🎵</div>`;

        }


        /* PDF */

        else if(isPDF(item.name)){

            preview.innerHTML =
                `<div class="icon">📕</div>`;

        }


        /* سایر فایل‌ها */

        else{

            preview.innerHTML =
                `<div class="icon">
                    ${getIcon(item.name)}
                </div>`;

        }


        const info =
            document.createElement("div");

        info.className="info";


        const name =
            document.createElement("div");

        name.className="name";

        name.textContent=item.name;


        const meta =
            document.createElement("div");

        meta.className="meta";


        if(item.type==="dir"){

            meta.textContent="📁 پوشه";

        }else{

            meta.textContent =
                getExtension(item.name) ||
                "فایل";

        }


        info.appendChild(name);

        info.appendChild(meta);


        card.appendChild(preview);

        card.appendChild(info);


        card.onclick=()=>{

            if(item.type==="dir"){

                history.push(currentPath);

                loadFiles(item.path);

            }else{

                openFile(item);

            }

        };


        files.appendChild(card);

    });

}


/* =========================
   باز کردن فایل
========================= */

async function openFile(item){

    const ext =
        getExtension(item.name);

    viewerTitle.textContent =
        item.name;

    githubLink.href =
        githubURL(item);

    viewerContent.innerHTML = `
        <div class="status">
            ⏳ در حال باز کردن فایل...
        </div>
    `;

    viewer.style.display="block";


    /* =====================
       HTML
    ===================== */

    if(isHTML(item.name)){

        /*
        اجرای واقعی HTML از GitHub Pages
        */

        const pageURL =
            "https://say4s.github.io/1632/" +
            item.path;

        viewerContent.innerHTML = `
            <iframe
                src="${pageURL}">
            </iframe>
        `;

        return;

    }


    /* =====================
       تصویر
    ===================== */

    if(isImage(item.name)){

        viewerContent.innerHTML = `
            <img
                src="${rawURL(item)}"
                alt="${escapeHTML(item.name)}">
        `;

        return;

    }


    /* =====================
       ویدئو
    ===================== */

    if(isVideo(item.name)){

        viewerContent.innerHTML = `
            <video
                controls
                autoplay
                src="${rawURL(item)}">
            </video>
        `;

        return;

    }


    /* =====================
       صوت
    ===================== */

    if(isAudio(item.name)){

        viewerContent.innerHTML = `
            <div class="file-info">

                <h2>🎵 ${escapeHTML(item.name)}</h2>

                <audio
                    controls
                    src="${rawURL(item)}">
                </audio>

            </div>
        `;

        return;

    }


    /* =====================
       PDF
    ===================== */

    if(isPDF(item.name)){

        viewerContent.innerHTML = `
            <iframe
                src="${rawURL(item)}">
            </iframe>
        `;

        return;

    }


    /* =====================
       فایل‌های متنی / کد
    ===================== */

    if(isText(item.name)){

        try{

            const response =
                await fetch(rawURL(item));

            const text =
                await response.text();

            viewerContent.innerHTML = `
                <pre>${escapeHTML(text)}</pre>
            `;

        }catch(error){

            showDownload(item);

        }

        return;

    }


    /* =====================
       فایل ناشناخته
    ===================== */

    showDownload(item);

}


/* =========================
   فایل دانلودی
========================= */

function showDownload(item){

    const size =
        item.size
        ? formatSize(item.size)
        : "نامشخص";

    viewerContent.innerHTML = `

        <div class="file-info">

            <h2>
                ${getIcon(item.name)}
                ${escapeHTML(item.name)}
            </h2>

            <div class="file-info-row">
                نوع:
                ${getExtension(item.name) || "نامشخص"}
            </div>

            <div class="file-info-row">
                حجم:
                ${size}
            </div>

            <div class="file-info-row">
                مسیر:
                ${escapeHTML(item.path)}
            </div>

            <a
                class="download"
                href="${rawURL(item)}"
                target="_blank"
                download>
                ⬇️ باز کردن / دانلود فایل
            </a>

        </div>
    `;

}


/* =========================
   بستن Viewer
========================= */

function closeViewer(){

    viewer.style.display="none";

    viewerContent.innerHTML="";

}


/* =========================
   برگشت
========================= */

function goBack(){

    if(!history.length)
        return;

    const previous =
        history.pop();

    loadFiles(previous);

}


/* =========================
   بروزرسانی
========================= */

function refresh(){

    loadFiles(currentPath);

}


/* =========================
   مسیر
========================= */

function updatePath(){

    path.textContent =
        "📁 " + currentPath;

    back.style.display =
        history.length
        ? "inline-block"
        : "none";

}


/* =========================
   جستجو
========================= */

search.addEventListener(
    "input",
    ()=>render(allItems)
);


/* =========================
   تشخیص فرمت‌ها
========================= */

function getExtension(name){

    const i =
        name.lastIndexOf(".");

    if(i===-1)
        return "";

    return name
        .substring(i)
        .toLowerCase();

}


function isHTML(name){

    return [
        ".html",
        ".htm"
    ].includes(
        getExtension(name)
    );

}


function isImage(name){

    return [
        ".jpg",
        ".jpeg",
        ".png",
        ".gif",
        ".webp",
        ".svg",
        ".bmp",
        ".ico",
        ".avif"
    ].includes(
        getExtension(name)
    );

}


function isVideo(name){

    return [
        ".mp4",
        ".webm",
        ".ogg",
        ".ogv",
        ".mov",
        ".m4v"
    ].includes(
        getExtension(name)
    );

}


function isAudio(name){

    return [
        ".mp3",
        ".wav",
        ".ogg",
        ".m4a",
        ".aac",
        ".flac"
    ].includes(
        getExtension(name)
    );

}


function isPDF(name){

    return getExtension(name)===".pdf";

}


/* =========================
   فایل متنی
========================= */

function isText(name){

    return [

        ".txt",
        ".md",
        ".json",
        ".js",
        ".css",
        ".html",
        ".htm",
        ".xml",
        ".csv",
        ".yaml",
        ".yml",
        ".py",
        ".java",
        ".c",
        ".cpp",
        ".h",
        ".hpp",
        ".php",
        ".sql",
        ".sh",
        ".bat",
        ".ps1",
        ".ini",
        ".conf",
        ".log",
        ".jsx",
        ".tsx",
        ".ts",
        ".vue"

    ].includes(
        getExtension(name)
    );

}


/* =========================
   آیکون
========================= */

/* =========================
   آیکون‌های وکتور (SVG) ابزارها
========================= */

function svgIcon(color, inner){

    return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;

}

const TOOL_ICONS = {

    /* مبدل فرمت AzmodQ */
    "TabdilAzmodQ.html": svgIcon("#58a6ff",
        `<path d="M4 8h13"/><path d="M13 4l4 4-4 4"/>
         <path d="M20 16H7"/><path d="M11 12l-4 4 4 4"/>`),

    /* فرم پیش‌ثبت‌نام */
    "form-sabtenam.html": svgIcon("#3fb950",
        `<rect x="5" y="4" width="14" height="17" rx="2"/>
         <path d="M9 4h6v3H9z"/>
         <path d="M8.5 12.5l1.5 1.5 2.5-3"/>
         <path d="M14.5 12.5H16"/>
         <path d="M8.5 17.5h7"/>`),

    /* انتخاب مسیر */

        `<path d="M12 21v-8"/>
         <path d="M12 13c0-3-6-2-6-7"/>
         <path d="M12 13c0-3 6-2 6-7"/>
         <path d="M3.5 8.5L6 6l2.5 2.5"/>
         <path d="M15.5 8.5L18 6l2.5 2.5"/>`),

    /* تبدیل JSON به اکسل */
    "json-to-Ex.html": svgIcon("#d29922",
        `<path d="M6 5C4.5 5 4 5.8 4 7v2c0 1-.8 2-2 3 1.2 1 2 2 2 3v2c0 1.2.5 2 2 2"/>
         <path d="M8.5 12h3"/><path d="M10 10l2 2-2 2"/>
         <rect x="13.5" y="6" width="8.5" height="12" rx="1.5"/>
         <path d="M13.5 10h8.5M13.5 14h8.5M17.7 6v12"/>`),

    /* ساخت کارنامه */
    "karnameh-generator.html": svgIcon("#a371f7",
        `<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
         <path d="M14 3v5h5"/>
         <path d="M9 17v-3M12 17v-5M15 17v-2"/>`),

    /* ویرایشگر کد ملی */
    "kodemeli.html": svgIcon("#79c0ff",
        `<rect x="2.5" y="5" width="16" height="12" rx="2"/>
         <circle cx="7.5" cy="10" r="1.6"/>
         <path d="M5 14.5c.4-1.3 1.4-1.8 2.5-1.8s2.1.5 2.5 1.8"/>

    /* ادغام فایل‌های اکسل */

         <path d="M9.5 17.5c3.5 0 3.5-5.5 6.5-5.5"/>
         <rect x="16" y="8" width="6" height="8" rx="1"/>
         <path d="M16 12h6"/>`),

    /* نمایش پاسخ‌نامه آزمون */
    "tabdil1.html": svgIcon("#ffa657",

         <g stroke-width="1">

};

/* آیکون پیش‌فرض برای هر HTML دیگری */
const DEFAULT_HTML_ICON = svgIcon("#58a6ff",
    `<path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/><path d="M13.5 5l-3 14"/>`);

function getToolIcon(name){

    return TOOL_ICONS[name] || DEFAULT_HTML_ICON;

}

function getIcon(name){

    if(TOOL_ICONS[name])
        return TOOL_ICONS[name];

    const ext =
        getExtension(name);

    const icons={

        ".html":"🌐",
        ".htm":"🌐",

        ".css":"🎨",

        ".js":"📜",
        ".jsx":"📜",

        ".ts":"📘",
        ".tsx":"📘",

        ".json":"🗃️",

        ".txt":"📄",
        ".md":"📝",

        ".pdf":"📕",

        ".jpg":"🖼️",
        ".jpeg":"🖼️",
        ".png":"🖼️",
        ".gif":"🖼️",
        ".webp":"🖼️",
        ".svg":"🖼️",

        ".mp4":"🎬",
        ".webm":"🎬",
        ".mov":"🎬",

========================= */

function formatSize(bytes){

    if(!bytes)
        return "0 B";

    const units=[
        "B",
        "KB",
        "MB",
        "GB",
        "TB"
    ];

    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        (bytes /
        Math.pow(1024,i))
        .toFixed(1)
        + " "
        + units[i]
    );

}

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent=text;

    return div.innerHTML;

}

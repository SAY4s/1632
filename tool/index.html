<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAY4s Tool Explorer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
}

}

}

    font-size: 14px;
}

.search:focus {
    border-color: #58a6ff;
}

button {

</style>
</head>

<body>

<header>

    <h1>📁 SAY4s / 1632 / tool</h1>

    <p>
        مرور فایل‌های موجود در پوشه Tool
    </p>

</header>


<div class="container">

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔍 جستجوی فایل..."
        >

        <button onclick="refresh()">
            🔄 بروزرسانی
        </button>

    </div>


    <button
        id="backButton"
        class="back"
        onclick="goBack()"
    >
        ← برگشت
    </button>


    <div
        id="path"
        class="path"
    >
        📁 tool
    </div>


    <div
        id="files"
        class="grid"
    >

        <div class="status">
            ⏳ در حال دریافت فایل‌ها...
        </div>

    </div>

</div>


<script>

/* ==============================
   تنظیمات
============================== */

const OWNER = "SAY4s";

const REPO = "1632";

const BRANCH = "main";

const GITHUB_PAGES =
    "https://say4s.github.io/1632/";

const ROOT_PATH = "tool";


/* ==============================
   متغیرها
============================== */

let currentPath = ROOT_PATH;

let history = [];

let allItems = [];


/* ==============================
   عناصر صفحه
============================== */

const filesContainer =
    document.getElementById("files");

const searchInput =
    document.getElementById("search");

const pathElement =
    document.getElementById("path");

const backButton =
    document.getElementById("backButton");


/* ==============================
   دریافت فایل‌ها
============================== */

async function loadFiles(path = currentPath) {

    currentPath = path;

    filesContainer.innerHTML = `
        <div class="status">
            ⏳ در حال دریافت فایل‌ها...
        </div>
    `;

    try {

        const api =
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(path)}?ref=${BRANCH}`;


        const response =
            await fetch(api);


        if (!response.ok) {

            throw new Error(
                `GitHub API Error: ${response.status}`
            );

        }


        const data =
            await response.json();


        if (!Array.isArray(data)) {

            throw new Error(
                "این مسیر یک پوشه نیست."
            );

        }


        allItems = data;

        updatePath();

        render(data);

    }

    catch (error) {

        filesContainer.innerHTML = `

            <div class="status error">

                ❌ خطا در دریافت فایل‌ها

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}


/* ==============================
   نمایش فایل‌ها
============================== */

function render(items) {

    const query =
        searchInput.value
            .toLowerCase()
            .trim();


    if (query) {

        items =
            items.filter(item =>
                item.name
                    .toLowerCase()
                    .includes(query)
            );

    }


    /* پوشه‌ها اول */

    items.sort((a, b) => {

        if (a.type === b.type) {

            return a.name.localeCompare(
                b.name,
                "fa"
            );

        }

        return a.type === "dir"
            ? -1
            : 1;

    });


    if (!items.length) {

        filesContainer.innerHTML = `

            <div class="status">

                📭 فایلی پیدا نشد

            </div>

        `;

        return;

    }


    filesContainer.innerHTML = "";


    items.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "card";


        /* ==================
           Preview
        ================== */

        const previewWrapper =
            document.createElement("div");

        previewWrapper.className =
            "preview-wrapper";


        const preview =
            document.createElement("div");

        preview.className = "preview";


        /* پوشه */

        if (item.type === "dir") {

            preview.innerHTML = `
                <div class="icon">📁</div>
            `;

        }


        /* تصویر */

        else if (
            isImage(item.name)
        ) {

            const img =
                document.createElement("img");


            img.src =
                `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${item.path}`;


            img.loading = "lazy";


            img.onerror = () => {

                preview.innerHTML = `
                    <div class="icon">
                        ${getIcon(item.name)}
                    </div>
                `;

            };


            preview.appendChild(img);

        }


        /* HTML */

        else if (
            isHTML(item.name)
        ) {

            preview.innerHTML = `
                <div class="icon">🌐</div>
            `;


            const badge =
                document.createElement("div");

            badge.className =
                "html-badge";

            badge.textContent =
                "اجرا می‌شود";

            previewWrapper.appendChild(
                badge
            );

        }


        /* سایر فایل‌ها */

        else {

            preview.innerHTML = `
                <div class="icon">
                    ${getIcon(item.name)}
                </div>
            `;

        }


        previewWrapper.insertBefore(
            preview,
            previewWrapper.firstChild
        );


        /* ==================
           اطلاعات
        ================== */

        const info =
            document.createElement("div");

        info.className = "info";


        const name =
            document.createElement("div");

        name.className = "name";

        name.textContent =
            item.name;


        const meta =
            document.createElement("div");

        meta.className = "meta";


        if (item.type === "dir") {

            meta.textContent =
                "📁 پوشه";

        }

        else {

            meta.textContent =
                getExtension(item.name);

        }


        info.appendChild(name);

        info.appendChild(meta);


        card.appendChild(
            previewWrapper
        );

        card.appendChild(info);


        /* ==================
           کلیک
        ================== */

        card.addEventListener(
            "click",
            () => {

                if (item.type === "dir") {

                    history.push(
                        currentPath
                    );

                    loadFiles(
                        item.path
                    );

                }

                else {

                    openFile(item);

                }

            }
        );


        filesContainer.appendChild(
            card
        );

    });

}


/* ==============================
   باز کردن فایل
============================== */

function openFile(item) {

    const extension =
        getExtension(item.name);


    /*
       اگر HTML بود:
       از GitHub Pages اجرا می‌شود.
    */

    if (
        extension === ".html" ||
        extension === ".htm"
    ) {

        const pagePath =
            item.path
                .replace(/^tool\//, "");


        const url =
            GITHUB_PAGES +
            "tool/" +
            pagePath;


        window.open(
            url,
            "_blank"
        );


        return;

    }


    /*
       فایل‌های دیگر:
       GitHub
    */

    window.open(
        item.html_url,
        "_blank"
    );

}


/* ==============================
   برگشت
============================== */

function goBack() {

    if (!history.length)
        return;


    const previous =
        history.pop();


    loadFiles(previous);

}


/* ==============================
   بروزرسانی
============================== */

function refresh() {

    loadFiles(
        currentPath
    );

}


/* ==============================
   مسیر
============================== */

function updatePath() {

    pathElement.textContent =
        "📁 " + currentPath;


    backButton.style.display =
        history.length
            ? "inline-block"
            : "none";

}


/* ==============================
   جستجو
============================== */

searchInput.addEventListener(
    "input",
    () => {

        render(allItems);

    }
);


/* ==============================
   تشخیص HTML
============================== */

function isHTML(name) {

    const ext =
        getExtension(name);

    return (
        ext === ".html" ||
        ext === ".htm"
    );

}


/* ==============================
   تشخیص تصویر
============================== */

function isImage(name) {

    const ext =
        getExtension(name);


    return [

        ".jpg",
        ".jpeg",
        ".png",
        ".gif",
        ".webp",
        ".svg",
        ".bmp",
        ".ico"

    ].includes(ext);

}


/* ==============================
   پسوند
============================== */

function getExtension(name) {

    const index =
        name.lastIndexOf(".");


    if (
        index === -1 ||
        index === name.length - 1
    ) {

        return "";

    }


    return name
        .substring(index)
        .toLowerCase();

}


/* ==============================
   آیکون فایل
============================== */

function getIcon(name) {

    const ext =
        getExtension(name);


    const icons = {

        ".html": "🌐",
        ".htm": "🌐",

        ".css": "🎨",

        ".js": "📜",

        ".json": "🗃️",

        ".txt": "📄",

        ".md": "📝",

        ".pdf": "📕",

        ".jpg": "🖼️",
        ".jpeg": "🖼️",
        ".png": "🖼️",
        ".gif": "🖼️",
        ".webp": "🖼️",
        ".svg": "🖼️",

        ".mp4": "🎬",
        ".webm": "🎬",
        ".mkv": "🎬",

        ".mp3": "🎵",
        ".wav": "🎵",

        ".zip": "🗜️",
        ".rar": "🗜️",
        ".7z": "🗜️",

        ".py": "🐍",

        ".exe": "⚙️",

        ".doc": "📘",
        ".docx": "📘",

        ".xls": "📊",
        ".xlsx": "📊",

        ".ppt": "📙",
        ".pptx": "📙"

    };


    return icons[ext] || "📄";

}


/* ==============================
   جلوگیری از HTML Injection
============================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ==============================
   شروع برنامه
============================== */

loadFiles();

</script>

</body>
</html>

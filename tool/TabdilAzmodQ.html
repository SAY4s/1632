<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مبدل فرمت AzmodQ</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#dfe3e8;--ac:#2563eb;--ok:#15803d;--er:#b91c1c;--code:#f1f3f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161a;--card:#1c2026;--tx:#e8eaed;--mut:#9aa3ae;--bd:#2d333b;--ac:#6ea0ff;--ok:#4ade80;--er:#f87171;--code:#14171b}}
:root[data-theme="dark"]{--bg:#13161a;--card:#1c2026;--tx:#e8eaed;--mut:#9aa3ae;--bd:#2d333b;--ac:#6ea0ff;--ok:#4ade80;--er:#f87171;--code:#14171b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 16px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;cursor:pointer;color:var(--mut)}
.drop.on{border-color:var(--ac);color:var(--ac)}
textarea{width:100%;min-height:120px;margin-top:10px;background:var(--code);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;direction:ltr;resize:vertical}
label.opt{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:.93rem}
button{font:inherit;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--ac);color:#fff}
button.sec{background:var(--code);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#msg{margin-top:8px;font-size:.9rem}
.ok{color:var(--ok)}.er{color:var(--er)}
pre{direction:ltr;text-align:left;background:var(--code);border:1px solid var(--bd);border-radius:8px;padding:10px;max-height:340px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:8px 0 0;white-space:pre}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--mut)}
.stats b{color:var(--tx)}
</style>
</head>
<body>
<main>
  <h1>مبدل فرمت AzmodQ</h1>
  <p class="sub">فایل <code>arshad.json</code> را بده؛ خروجی به فرمت <code>diploma.json</code> (فقط <code>q</code> و <code>o</code> و <code>a</code>) تحویل می‌گیری.</p>

  <div class="card">
    <div class="drop" id="drop">فایل JSON را اینجا رها کن یا برای انتخاب کلیک کن</div>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <textarea id="src" placeholder="یا محتوای JSON را اینجا پیست کن…"></textarea>
  </div>

  <div class="card">
    <label class="opt"><input type="checkbox" id="optMove" checked><span>گزینهٔ صحیح را به جایگاه اول ببر (<code>a: 0</code>) — مثل diploma.json</span></label>
    <label class="opt"><input type="checkbox" id="optStrip" checked><span>فیلدهای اضافه (<code>y</code> و <code>s</code>) را حذف کن</span></label>
    <label class="opt"><input type="checkbox" id="optDedupe"><span>سؤال‌های تکراری (هم‌متن و هم‌گزینه) را حذف کن</span></label>
    <div class="row"><button id="go">تبدیل</button></div>
    <div id="msg"></div>
  </div>

  <div class="card" id="outCard" hidden>
    <div class="stats" id="stats"></div>
    <div class="row">
      <button id="dl">دانلود diploma-format.json</button>
      <button class="sec" id="cp">کپی خروجی</button>
    </div>
    <pre id="out"></pre>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let result = "", srcText = "";

function show(text, cls){ const m=$("msg"); m.textContent=text; m.className=cls||""; }

function convert(){
  $("outCard").hidden = true;
  let data;
  if(!srcText.trim()) return show("ابتدا فایل را انتخاب کن یا JSON را پیست کن.", "er");
  try { data = JSON.parse(srcText.replace(/^\uFEFF/, "")); }
  catch(e){ return show("JSON نامعتبر است: " + e.message + (srcText.length === 100000 ? " — ورودی دقیقاً ۱۰۰٬۰۰۰ کاراکتر است و احتمالاً پیست بریده شده؛ فایل را با دکمهٔ آپلود بده." : ""), "er"); }
  if(!Array.isArray(data)) return show("ورودی باید آرایه‌ای از سؤال‌ها باشد.", "er");

  const move = $("optMove").checked, strip = $("optStrip").checked, dedupe = $("optDedupe").checked;
  const out = [], seen = new Set(), problems = [];
  let dups = 0;

  data.forEach((item, i) => {
    if(!item || typeof item.q !== "string" || !Array.isArray(item.o) || !Number.isInteger(item.a) || item.a < 0 || item.a >= item.o.length){
      problems.push(i + 1); return;
    }
    let o = item.o.slice(), a = item.a;
    if(move && a !== 0){ const right = o[a]; o.splice(a, 1); o.unshift(right); a = 0; }
    const rec = { q: item.q, o, a };
    if(!strip){ for(const k of Object.keys(item)) if(!(k in rec)) rec[k] = item[k]; }
    if(dedupe){
      const key = item.q + "||" + [...o].sort().join("|");
      if(seen.has(key)){ dups++; return; }
      seen.add(key);
    }
    out.push(rec);
  });

  result = JSON.stringify(out, null, 2);
  $("out").textContent = result.length > 60000 ? result.slice(0, 60000) + "\n… (preview truncated; download the full file)" : result;
  const sizeKB = (new Blob([result]).size / 1024).toFixed(1);
  $("stats").innerHTML = `<span>ورودی: <b>${data.length}</b></span><span>خروجی: <b>${out.length}</b></span>` +
    (dups ? `<span>تکراری حذف‌شده: <b>${dups}</b></span>` : "") +
    (problems.length ? `<span class="er">ردیف نامعتبر: <b>${problems.length}</b> (${problems.slice(0,8).join("، ")}${problems.length>8?"…":""})</span>` : "") +
    `<span>حجم: <b>${sizeKB} KB</b></span>`;
  $("outCard").hidden = false;
  show("تبدیل انجام شد.", "ok");
}

function loadFile(f){
  if(!f) return;
  f.text().then(t => {
    srcText = t;
    $("src").value = t.length < 20000 ? t : "";
    $("src").placeholder = "«" + f.name + "» بارگذاری شد (" + t.length.toLocaleString() + " کاراکتر)";
    show("«" + f.name + "» بارگذاری شد."); convert();
  }).catch(e => show("خواندن فایل ناموفق بود: " + e.message, "er"));
}

$("src").addEventListener("input", () => { srcText = $("src").value; });
$("go").onclick = convert;
$("drop").onclick = () => $("file").click();
$("file").onchange = e => loadFile(e.target.files[0]);
["dragover","dragenter"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("on"); }));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("on"); }));
$("drop").addEventListener("drop", e => loadFile(e.dataTransfer.files[0]));

$("dl").onclick = () => {
  const url = URL.createObjectURL(new Blob([result], {type:"application/json"}));
  const a = document.createElement("a"); a.href = url; a.download = "diploma-format.json";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
};
$("cp").onclick = async () => {
  try { await navigator.clipboard.writeText(result); show("کپی شد.", "ok"); }
  catch(e){ show("کپی خودکار ممکن نشد؛ از دانلود استفاده کن.", "er"); }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرم پیش‌ثبت‌نام</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap');
:root{
  --ink:#241f16;
  --paper:#e7decb;
  --sheet:#faf6ea;
  --line:#c9bf9f;
  --gold:#9c7a24;
  --forest:#2c4a34;
  --forest-dark:#1c3323;
  --err:#a4342a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Vazirmatn','Tahoma',sans-serif;
  line-height:1.8;
  padding:36px 14px 60px;
}
.page{max-width:720px;margin:0 auto;}

.frame{
  position:relative;
  background:var(--sheet);
  border:2px solid var(--ink);
  padding:56px 36px 40px;
}
.frame::before{
  content:'';
  position:absolute;
  inset:8px;
  border:1px solid var(--ink);
  pointer-events:none;
}

.corner{position:absolute;width:30px;height:30px;z-index:2;
  background-image:
    linear-gradient(45deg, var(--ink) 25%, transparent 25.5%, transparent 74.5%, var(--ink) 75%),
    linear-gradient(45deg, var(--ink) 25%, transparent 25.5%, transparent 74.5%, var(--ink) 75%);
  background-size:15px 15px;
  background-position:0 0, 7.5px 7.5px;
  opacity:.92;
}
.corner::after{content:'';position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:var(--sheet);}
.corner.tl{top:-15px;left:-15px;} .corner.tl::after{top:9px;left:9px;}
.corner.tr{top:-15px;right:-15px;} .corner.tr::after{top:9px;right:9px;}
.corner.bl{bottom:-15px;left:-15px;} .corner.bl::after{bottom:9px;left:9px;}
.corner.br{bottom:-15px;right:-15px;} .corner.br::after{bottom:9px;right:9px;}

.rule{height:1px;background:var(--ink);position:relative;margin:12px 0;}
.rule::after{content:'';position:absolute;left:0;right:0;top:4px;height:1px;background:var(--ink);}

.title-block{margin-bottom:34px;}
.title-block h1{
  margin:10px 0 0;
  font-size:27px;
  font-weight:800;
  text-align:center;
  letter-spacing:.3px;
  color:var(--ink);
}
.title-block .sub{
  text-align:center;
  font-size:13.5px;
  color:#5e5744;
  margin:14px 0 0;
}

.field{
  display:flex;
  align-items:baseline;
  gap:14px;
  padding:13px 0;
}
.field label{
  flex:0 0 172px;
  text-align:right;
  font-weight:700;
  font-size:14.5px;
  padding-top:9px;
}
.field label .req{color:var(--err);margin-inline-start:3px;}
.field .val{flex:1;min-width:0;}

input[type=text],input[type=tel],textarea,select{
  font-family:inherit;
  font-size:15px;
  padding:8px 4px;
  border:none;
  border-bottom:1.5px solid var(--ink);
  border-radius:0;
  background:transparent;
  color:var(--ink);
  width:100%;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-bottom-color:var(--gold);
  border-bottom-width:2px;
}
textarea{resize:vertical;min-height:50px;}
select{background:transparent;}

.dategrp{display:flex;gap:10px;}
.dategrp select{flex:1;text-align:center;}

.hint{font-size:11.5px;color:#8a8166;margin-top:4px;}
.errmsg{font-size:12.5px;color:var(--err);min-height:16px;margin-top:3px;}

.auto{
  padding:8px 4px;
  border-bottom:1.5px dashed var(--line);
  font-size:14.5px;
  color:#5e5744;
}

.actions{display:flex;justify-content:center;margin-top:26px;}
button{
  font-family:inherit;
  font-size:15.5px;
  font-weight:700;
  background:var(--forest);
  color:#fdfaf2;
  border:none;
  padding:12px 44px;
  border-radius:2px;
  cursor:pointer;
  letter-spacing:.3px;
}
button:hover{background:var(--forest-dark);}
button:disabled{background:#9aa79c;cursor:wait;}

.status{margin-top:18px;padding:12px 14px;border-radius:2px;font-size:14px;display:none;text-align:center;}
.status.ok{display:block;background:#e6efe2;border:1px solid var(--forest);color:var(--forest-dark);}
.status.bad{display:block;background:#f5e4e1;border:1px solid var(--err);color:var(--err);}

#receipt{margin-top:24px;padding-top:28px;}
#receipt .rtitle{text-align:center;font-weight:800;font-size:18px;margin-bottom:16px;}
.receipt-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px;}
.receipt-row:last-child{border-bottom:none;}
.receipt-row .k{color:#5e5744;}
.receipt-row .v{font-weight:600;text-align:left;}

@media print{
  body{background:#fff;padding:0;margin:0;}
  .page{max-width:none;margin:0;}
  .frame{border:none;padding:18px;background:#fff;}
  .frame::before{display:none;}
  .corner{display:none;}
  .title-block{display:none;}
  #regForm{display:none;}
  #receipt{margin-top:0;padding-top:0;}
  #printBtn{display:none;}
}
@media (max-width:480px){
  .field{flex-direction:column;align-items:stretch;gap:4px;}
  .field label{flex:none;padding-top:0;}
}
</style>
</head>
<body>
<div class="page">
  <div class="frame">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <div class="title-block">
      <div class="rule"></div>
      <h1>فرم پیش‌ثبت‌نام مرکز آموزش</h1>
      <div class="rule"></div>
      <p class="sub">لطفاً اطلاعات زیر را با دقت تکمیل کنید. موارد ستاره‌دار الزامی هستند.</p>
    </div>

    <form id="regForm" novalidate>

      <div class="field">
        <label for="firstName">نام<span class="req">*</span></label>
        <div class="val"><input type="text" id="firstName" required><div class="errmsg"></div></div>
      </div>

      <div class="field">
        <label for="lastName">نام خانوادگی<span class="req">*</span></label>
        <div class="val"><input type="text" id="lastName" required><div class="errmsg"></div></div>
      </div>

      <div class="field">
        <label for="fatherName">نام پدر<span class="req">*</span></label>
        <div class="val"><input type="text" id="fatherName" required><div class="errmsg"></div></div>
      </div>

      <div class="field">
        <label for="nationalId">کد ملی<span class="req">*</span></label>
        <div class="val"><input type="text" id="nationalId" inputmode="numeric" maxlength="10" required><div class="errmsg"></div></div>
      </div>

      <div class="field">
        <label for="idNumber">شماره شناسنامه<span class="req">*</span></label>
        <div class="val"><input type="text" id="idNumber" inputmode="numeric" required><div class="errmsg"></div></div>
      </div>

      <div class="field">
        <label>تاریخ تولد (شمسی)<span class="req">*</span></label>
        <div class="val">
          <div class="dategrp">
            <select id="bYear"></select>
            <select id="bMonth"></select>
            <select id="bDay"></select>
          </div>
          <div class="errmsg"></div>
        </div>
      </div>

      <div class="field">
        <label for="issuePlace">محل صدور</label>
        <div class="val"><input type="text" id="issuePlace"></div>
      </div>

      <div class="field">
        <label for="degree">میزان مدرک تحصیلی<span class="req">*</span></label>
        <div class="val">
          <select id="degree" required>
            <option value="">— انتخاب کنید —</option>
            <option>زیر دیپلم</option>
            <option>دیپلم</option>
            <option>فوق دیپلم</option>
            <option>کارشناسی</option>
            <option>کارشناسی ارشد</option>
            <option>دکتری</option>
          </select>
          <div class="errmsg"></div>
        </div>
      </div>

      <div class="field">
        <label for="mobile1">موبایل ۱<span class="req">*</span></label>
        <div class="val"><input type="tel" id="mobile1" inputmode="numeric" placeholder="09xxxxxxxxx" required><div class="errmsg"></div></div>
      </div>

      <div class="field">
        <label for="mobile2">موبایل ۲<span class="req">*</span></label>
        <div class="val"><input type="tel" id="mobile2" inputmode="numeric" placeholder="09xxxxxxxxx" required><div class="errmsg"></div></div>
      </div>

      <div class="field">
        <label for="phone3">تلفن منزل / موبایل ۳</label>
        <div class="val"><input type="tel" id="phone3" inputmode="numeric"></div>
      </div>

      <div class="field">
        <label for="address">آدرس محل سکونت<span class="req">*</span></label>
        <div class="val"><textarea id="address" required></textarea><div class="errmsg"></div></div>
      </div>

      <div class="field">
        <label>تاریخ ثبت‌نام</label>
        <div class="val">
          <div class="auto" id="autoDate">—</div>
          <div class="hint">به‌صورت خودکار ثبت می‌شود</div>
        </div>
      </div>

      <div class="field">
        <label for="major">رشته ثبت‌نامی</label>
        <div class="val"><input type="text" id="major"></div>
      </div>

      <div class="field">
        <label for="notes">توضیحات</label>
        <div class="val"><textarea id="notes"></textarea></div>
      </div>

      <div class="actions">
        <button type="submit" id="submitBtn">ثبت‌نام</button>
      </div>
      <div class="status" id="statusBox"></div>
    </form>

    <div id="receipt" style="display:none;">
      <div class="rule"></div>
      <div class="rtitle">رسید ثبت‌نام</div>
      <div id="receiptBody"></div>
      <div class="actions" style="margin-top:18px;">
        <button type="button" id="printBtn">چاپ رسید</button>
      </div>
    </div>

  </div>
</div>

<script>
/* ===== پیکربندی: از خونه B5 یک گوگل‌شیت پابلیش‌شده خونده می‌شه ===== */
/* فرمت محتوای خونه B5 (بدون فاصله اضافه):
   owner/repo,filename,branch,token
   مثال: SAY4s/1632,Data.json,main,github_pat_xxxxxxxxxx
   شیت باید از مسیر File > Share > Publish to web پابلیش شده باشد. */
const PUBLISHED_ID = '2PACX-1vRQwgHgBvIpgkVHaKENnJgnwdEYIrUSLqUH7s0_xUWkEx-GcMI_EPUiURR_OrNBA7fED984X6Ygam1I';
const SHEET_GID = '0';
const CONFIG_ROW = 5; // ردیف ۵
const CONFIG_COL = 1; // ستون B (A=0, B=1)

function parseCSV(str){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i=0;i<str.length;i++){
    const c = str[i];
    if (inQuotes){
      if (c === '"'){ if (str[i+1] === '"'){ field+='"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field=''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

let CONFIG = null;
async function loadConfig(){
  const url = `https://docs.google.com/spreadsheets/d/e/${PUBLISHED_ID}/pub?output=csv&gid=${SHEET_GID}`;
  let res;
  try{
    res = await fetch(url);
  } catch(e){
    throw new Error('اتصال به گوگل‌شیت برقرار نشد (Failed to fetch) — اینترنت/VPN را بررسی کن');
  }
  if (!res.ok){
    throw new Error('گوگل‌شیت در دسترس نیست — مطمئن شو از File > Share > Publish to web پابلیش شده');
  }
  const bodyText = await res.text();
  if (bodyText.trim().startsWith('<')){
    throw new Error('این لینک CSV برنمی‌گردونه — Publish to web را دوباره چک کن');
  }
  const rows = parseCSV(bodyText);
  const cell = (rows[CONFIG_ROW-1] && rows[CONFIG_ROW-1][CONFIG_COL]) ? rows[CONFIG_ROW-1][CONFIG_COL].trim() : '';
  const [repoFull, fileName, branch, token] = cell.split(',').map(s=>s.trim());
  if (!repoFull || !fileName || !branch || !token) throw new Error('محتوای خونه B5 ناقص یا با فرمت اشتباه است');
  const [owner, repo] = repoFull.split('/');
  return { owner, repo, fileName, branch, token };
}
/* =================================================================== */

const faMonths = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

function fillSelect(el, from, to, step=1){
  el.innerHTML = '';
  if (step === -1){
    for(let i=from;i>=to;i--){const o=document.createElement('option');o.value=i;o.textContent=i;el.appendChild(o);}
  } else {
    for(let i=from;i<=to;i+=step){const o=document.createElement('option');o.value=i;o.textContent=i;el.appendChild(o);}
  }
}
const bYear = document.getElementById('bYear');
const bMonth = document.getElementById('bMonth');
const bDay = document.getElementById('bDay');
fillSelect(bYear, 1410, 1300, -1);
bYear.insertAdjacentHTML('afterbegin','<option value="">سال</option>');
bMonth.innerHTML = '<option value="">ماه</option>' + faMonths.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
fillSelect(bDay, 1, 31);
bDay.insertAdjacentHTML('afterbegin','<option value="">روز</option>');

// تبدیل میلادی به شمسی برای ثبت خودکار تاریخ ثبت‌نام
function gregorianToJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461); days %= 1461;
  jy += Math.floor((days-1)/365); if (days > 365) days = (days-1)%365;
  const jm = (days < 186) ? 1+Math.floor(days/31) : 7+Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
  return [jy, jm, jd];
}
const today = new Date();
const [jy,jm,jd] = gregorianToJalali(today.getFullYear(), today.getMonth()+1, today.getDate());
const jalaliToday = `${jd} ${faMonths[jm-1]} ${jy}`;
document.getElementById('autoDate').textContent = jalaliToday;

function validateNationalId(code){
  if (!/^\d{10}$/.test(code)) return false;
  if (/^(\d)\1{9}$/.test(code)) return false;
  const check = parseInt(code[9],10);
  let sum = 0;
  for (let i=0;i<9;i++) sum += parseInt(code[i],10) * (10-i);
  const r = sum % 11;
  return (r < 2 && check === r) || (r >= 2 && check === 11-r);
}
const mobileRe = /^09\d{9}$/;

function setErr(input, msg){
  const box = input.closest('.field').querySelector('.errmsg');
  if (box) box.textContent = msg || '';
  input.style.borderColor = msg ? 'var(--err)' : 'var(--line)';
}

function validate(){
  let ok = true;
  const req = [['firstName','نام را وارد کنید'],['lastName','نام خانوادگی را وارد کنید'],
    ['fatherName','نام پدر را وارد کنید'],['idNumber','شماره شناسنامه را وارد کنید'],
    ['degree','مدرک تحصیلی را انتخاب کنید'],['address','آدرس را وارد کنید']];
  req.forEach(([id,msg])=>{
    const el = document.getElementById(id);
    if (!el.value.trim()){ setErr(el,msg); ok=false; } else setErr(el,'');
  });

  const nid = document.getElementById('nationalId');
  if (!validateNationalId(nid.value.trim())){ setErr(nid,'کد ملی معتبر نیست'); ok=false; } else setErr(nid,'');

  const m1 = document.getElementById('mobile1');
  if (!mobileRe.test(m1.value.trim())){ setErr(m1,'شماره موبایل معتبر نیست'); ok=false; } else setErr(m1,'');

  const m2 = document.getElementById('mobile2');
  if (!mobileRe.test(m2.value.trim())){ setErr(m2,'شماره موبایل معتبر نیست'); ok=false; } else setErr(m2,'');

  const dateErrBox = bDay.closest('.field').querySelector('.errmsg');
  if (!bYear.value || !bMonth.value || !bDay.value){ dateErrBox.textContent='تاریخ تولد را کامل انتخاب کنید'; ok=false; }
  else dateErrBox.textContent='';

  return ok;
}

function b64EncodeUtf8(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUtf8(str){
  return decodeURIComponent(escape(atob(str)));
}

async function submitToGithub(data){
  if (!CONFIG) CONFIG = await loadConfig();
  const apiUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.fileName}`;
  const headers = {
    'Authorization': `token ${CONFIG.token}`,
    'Content-Type': 'application/json'
  };

  // خواندن فایل فعلی برای افزودن رکورد جدید به آرایه
  let list = [];
  let sha = undefined;
  let getRes;
  try{
    getRes = await fetch(`${apiUrl}?ref=${CONFIG.branch}`, { headers });
  } catch(e){
    throw new Error('اتصال به GitHub API برقرار نشد (Failed to fetch) — اینترنت/VPN را بررسی کن');
  }
  if (getRes.status === 200){
    const file = await getRes.json();
    sha = file.sha;
    try{ list = JSON.parse(b64DecodeUtf8(file.content.replace(/\n/g,''))); }
    catch(e){ list = []; }
    if (!Array.isArray(list)) list = [];
  } else if (getRes.status !== 404){
    throw new Error('خطا در خواندن فایل اطلاعات از گیت‌هاب');
  }

  list.push(data);
  const body = {
    message: `ثبت‌نام جدید: ${data.firstName} ${data.lastName}`,
    content: b64EncodeUtf8(JSON.stringify(list, null, 2)),
    branch: CONFIG.branch
  };
  if (sha) body.sha = sha;

  let putRes;
  try{
    putRes = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
  } catch(e){
    throw new Error('اتصال به GitHub API برقرار نشد (Failed to fetch) — اینترنت/VPN را بررسی کن');
  }
  if (!putRes.ok){
    const errBody = await putRes.json().catch(()=>({}));
    throw new Error(`خطا در ذخیره‌سازی در گیت‌هاب: ${errBody.message || putRes.status}`);
  }
  return putRes.json();
}

function showReceipt(data){
  const rows = [
    ['نام و نام خانوادگی', `${data.firstName} ${data.lastName}`],
    ['نام پدر', data.fatherName],
    ['کد ملی', data.nationalId],
    ['شماره شناسنامه', data.idNumber],
    ['محل صدور', data.issuePlace || '—'],
    ['تاریخ تولد', data.birthDate],
    ['میزان مدرک تحصیلی', data.degree],
    ['رشته ثبت‌نامی', data.major || '—'],
    ['موبایل ۱', data.mobile1],
    ['موبایل ۲', data.mobile2],
    ['تلفن منزل / موبایل ۳', data.phone3 || '—'],
    ['آدرس محل سکونت', data.address],
    ['تاریخ ثبت‌نام', data.registrationDate],
    ['توضیحات', data.notes || '—']
  ];
  const body = document.getElementById('receiptBody');
  body.innerHTML = rows.map(([k,v])=>
    `<div class="receipt-row"><span class="k">${k}</span><span class="v">${v}</span></div>`
  ).join('');
  const receipt = document.getElementById('receipt');
  receipt.style.display = 'block';
  receipt.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('printBtn').addEventListener('click', ()=> window.print());

document.getElementById('regForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const statusBox = document.getElementById('statusBox');
  statusBox.className = 'status';
  statusBox.textContent = '';
  if (!validate()){
    statusBox.className = 'status bad';
    statusBox.textContent = 'فرم ناقص یا نادرست است — موارد قرمزرنگ را اصلاح کنید.';
    const firstBad = document.querySelector('.errmsg:not(:empty)');
    const target = firstBad ? (firstBad.closest('.field') || firstBad) : statusBox;
    target.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  const data = {
    firstName: document.getElementById('firstName').value.trim(),
    lastName: document.getElementById('lastName').value.trim(),
    fatherName: document.getElementById('fatherName').value.trim(),
    nationalId: document.getElementById('nationalId').value.trim(),
    idNumber: document.getElementById('idNumber').value.trim(),
    birthDate: `${bYear.value}/${bMonth.value}/${bDay.value}`,
    issuePlace: document.getElementById('issuePlace').value.trim(),
    degree: document.getElementById('degree').value,
    major: document.getElementById('major').value.trim(),
    mobile1: document.getElementById('mobile1').value.trim(),
    mobile2: document.getElementById('mobile2').value.trim(),
    phone3: document.getElementById('phone3').value.trim(),
    address: document.getElementById('address').value.trim(),
    registrationDate: jalaliToday,
    notes: document.getElementById('notes').value.trim()
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'در حال ثبت...';
  try{
    await submitToGithub(data);
    statusBox.className = 'status ok';
    statusBox.textContent = 'ثبت‌نام با موفقیت انجام شد.';
    showReceipt(data);
    e.target.reset();
    fillSelect(bYear, 1410, 1300, -1);
    bYear.insertAdjacentHTML('afterbegin','<option value="">سال</option>');
  } catch(err){
    statusBox.className = 'status bad';
    statusBox.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'ثبت‌نام';
  }
});
</script>
</body>
</html>
